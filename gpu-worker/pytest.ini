[pytest]
testpaths = tests
# Hard per-test timeout: the transcription modules shell out to ffmpeg/ffprobe,
# and a hung subprocess must fail the test rather than burn the whole job.
addopts = --timeout=120
# Make `gpu_worker` importable when pytest runs from this directory with the
# `pytest` console script (which does not add cwd to sys.path the way
# `python -m pytest` does). CI runs `pytest tests -q` from this directory.
pythonpath = .
# No asyncio_mode here on purpose: the CI dependency subset
# (requirements-ci.txt) does not install pytest-asyncio, and an unknown ini
# option would warn on every CI run. Async tests, if ever added, mark
# themselves with @pytest.mark.asyncio and run locally via requirements-dev.txt.
