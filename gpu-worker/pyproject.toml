[tool.ruff]
target-version = "py312"
line-length = 120
src = ["gpu_worker", "tests", "scripts"]

[tool.ruff.lint]
# Same rule set / ignores as backend/pyproject.toml so the extracted code keeps
# the look it was reviewed with (and so a future move of more files in doesn't
# churn). No TID251 banned-api here: the GPU worker has no AI-service layer.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument
    "E711",   # none comparison
    "E712",   # true/false comparison
    "E402",   # module import not at top (celery_app registers tasks at bottom)
    "F401",   # unused import (celery_app's side-effect imports)
    "RUF001", # ambiguous unicode character (Chinese strings)
    "RUF002", # ambiguous unicode character (Chinese docstrings)
    "RUF003", # ambiguous unicode character (Chinese comments)
    "SIM",    # simplify suggestions (opinionated, low value)
    "UP042",  # replace-str-enum (intentional pattern, matches backend VideoSource)
    "UP046",  # non-pep695-generic-class
    "UP047",  # non-pep695-generic-function
    "N806",   # non-lowercase variable
    "TC003",  # typing-only standard library import
]

[tool.ruff.lint.isort]
known-first-party = ["gpu_worker", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Test configuration lives in pytest.ini (pytest prefers it over a
# [tool.pytest.ini_options] table; declaring that table here would make pytest
# warn and silently ignore it). Keep this file ruff-only.
