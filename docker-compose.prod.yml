# Production.
# Secrets come from the shell environment or a .env file.
#
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    # Publish to the host loopback only so a remote GPU worker can reach the
    # broker over an SSH tunnel / WireGuard without exposing Redis to the
    # public internet. GPU worker REDIS_URL: redis://:<pw>@127.0.0.1:6379/0
    # (via `ssh -L 6379:127.0.0.1:6379 ...` from the GPU machine).
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    # The image ENTRYPOINT runs `alembic upgrade head` first, then execs the
    # command below. Keep the entrypoint so migrations run on every start.
    command: >
      gunicorn app.main:app
        -w 2
        -k uvicorn.workers.UvicornWorker
        -b 0.0.0.0:8000
        --access-logfile -
        --error-logfile -
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_UPLOAD_ENABLED: ${OSS_UPLOAD_ENABLED:-false}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_PREFIX: ${OSS_PREFIX:-}
      # Remote-GPU transcription callback (inbound) auth + watchdog timeout.
      TRANSCRIPTION_CALLBACK_SECRET: ${TRANSCRIPTION_CALLBACK_SECRET:-}
      VIDEO_TRANSCRIBE_TIMEOUT: ${VIDEO_TRANSCRIBE_TIMEOUT:-7200}
      # Translation engine: agnes 继承 OPENAI_*（可指向 deepseek 等 OpenAI-compatible 端点）
      TRANSLATION_ENGINE: ${TRANSLATION_ENGINE:-agnes}
      TRANSLATION_FALLBACK_ENGINE: ${TRANSLATION_FALLBACK_ENGINE:-}
      TRANSLATION_CONCURRENT: ${TRANSLATION_CONCURRENT:-false}
      ENV: ${ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Trust X-Forwarded-For from the nginx container so per-IP rate
      # limiting (app.core.limiter) sees real client IPs instead of the
      # nginx container IP for every request. Safe: backend is only
      # exposed on the internal compose network behind nginx.
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    # Cloud worker consumes only the default queue; the transcription_gpu queue
    # is drained by the remote GPU worker (not this service).
    command: celery -A app.tasks.celery_app worker -Q celery --loglevel=warning
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_UPLOAD_ENABLED: ${OSS_UPLOAD_ENABLED:-false}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_PREFIX: ${OSS_PREFIX:-}
      TRANSCRIPTION_CALLBACK_SECRET: ${TRANSCRIPTION_CALLBACK_SECRET:-}
      VIDEO_TRANSCRIBE_TIMEOUT: ${VIDEO_TRANSCRIBE_TIMEOUT:-7200}
      TRANSLATION_ENGINE: ${TRANSLATION_ENGINE:-agnes}
      TRANSLATION_FALLBACK_ENGINE: ${TRANSLATION_FALLBACK_ENGINE:-}
      TRANSLATION_CONCURRENT: ${TRANSLATION_CONCURRENT:-false}
      ENV: ${ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    # Periodic tasks: order-expiry + stale-transcription watchdog.
    command: celery -A app.tasks.celery_app beat --loglevel=warning
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSCRIPTION_CALLBACK_SECRET: ${TRANSCRIPTION_CALLBACK_SECRET:-}
      VIDEO_TRANSCRIBE_TIMEOUT: ${VIDEO_TRANSCRIBE_TIMEOUT:-7200}
      TRANSLATION_ENGINE: ${TRANSLATION_ENGINE:-agnes}
      TRANSLATION_FALLBACK_ENGINE: ${TRANSLATION_FALLBACK_ENGINE:-}
      TRANSLATION_CONCURRENT: ${TRANSLATION_CONCURRENT:-false}
      ENV: ${ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://:${REDIS_PASSWORD}@redis:6379/0 flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- 日志聚合 (E3) -------------------------------------------------------
  # Loki + Promtail 收集所有容器的 json-file 日志。structlog 已输出 JSON,
  # Promtail 直接抓取 /var/lib/docker/containers 的日志文件。
  # 启用: 取消下方注释, 在服务器上 `docker compose -f docker-compose.prod.yml up -d loki promtail`。
  # Grafana 可加作可视化面板 (本节未含, 按需自行加 grafana 服务并指 datasource=loki)。
  #
  # loki:
  #   image: grafana/loki:3.0.0
  #   restart: unless-stopped
  #   command: -config.file=/etc/loki/local-config.yaml
  #   volumes:
  #     - loki-data:/loki
  #   expose:
  #     - "3100"
  #
  # promtail:
  #   image: grafana/promtail:3.0.0
  #   restart: unless-stopped
  #   volumes:
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./promtail.yml:/etc/promtail/config.yml:ro
  #   command: -config.file=/etc/promtail/config.yml
  #   depends_on:
  #     - loki

volumes:
  pgdata:
  media:
  # loki-data:
