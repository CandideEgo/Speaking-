# Only for a separate synthetic Compose project. No existing host gateway is reused.
services:
  adapter:
    image: seeword-content-receipt-adapter:local-check
    ports: !reset []
  adapter-shim:
    image: seeword-content-receipt-adapter:local-check
  probe:
    volumes: !override
      - ./backend/scripts/check_v2_gateway.py:/spike/check_v2_gateway.py:ro
      - ./refactor-blueprint/evidence/content-receipts:/evidence
