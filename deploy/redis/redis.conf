# SeeWord Redis — 持久化与恢复契约（A07 / OPS-03）。
#
# 为什么有这个文件：生产 Redis 同时承担 Celery broker/result、JWT 黑名单、
# 回调去重锁、限流计数与缓存。此前 docker-compose.prod.yml 里的 redis 既没有
# 卷也没有 AOF，`docker compose up -d` 一重建容器，队列与撤销状态就一起没了。
#
# 契约（见 docs/iteration-3-isolation-validation-2026-10-30.md §3）：
#   - 单实例 + 命名卷 + AOF，`appendfsync everysec`；
#   - 允许损失窗口：SIGKILL 前最后约 2 秒内的写入（A07-T3 实测值见
#     docs/evidence/iteration-3/）；
#   - AOF 是唯一恢复源；RDB 快照关闭，避免 BGSAVE fork 失败把 Redis 变成
#     只读（`stop-writes-on-bgsave-error`），那会直接卡死 Celery 入队；
#   - 禁止淘汰：队列消息与黑名单条目被淘汰是正确性问题，不是缓存未命中。
#
# 密码不在本文件（不把密钥写进 git）。命令行传入：
#   redis-server /usr/local/etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"

appendonly yes
appendfsync everysec
appenddirname appendonlydir

# 重写用 RDB 前导（Redis 7 默认），重放更快、文件更小。
aof-use-rdb-preamble yes

# A07-T3 依赖它：SIGKILL 可能把最后一条命令写一半，重启时截断到最后一个
# 完整命令，而不是拒绝启动。截断会记 warning，属于预期内的损失。
aof-load-truncated yes

# 不写 RDB。AOF 覆盖同一份数据；关掉快照后没有 fork/写盘压力，
# 也不会因磁盘抖动进入 stop-writes-on-bgsave-error。
save ""

# 明确 noeviction：这里存的是队列与撤销状态，内存压力必须表现为写入报错
# 被运维看见，而不是静默丢掉某个用户的令牌或一条转写任务。
maxmemory-policy noeviction

dir /data
