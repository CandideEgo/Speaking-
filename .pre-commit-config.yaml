repos:
  # Python linting + formatting (replaces black, isort, flake8)
  # v0.7+ required: pyproject.toml uses UP046/UP047 (PEP 695 generics) rules,
  # which were introduced in ruff 0.7 (0.6.x rejects them as unknown selectors).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend formatting — local prettier so version matches package.json (^3.9.5)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: ^frontend/
        types_or: [ts, tsx, css, json, markdown]


  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
        # 大文件例外两处：发布物料，以及量具跑出来的原始读数。
        # `docs/design/mobile/destination/readings/touch-targets-375.json` 是 3.05 MB ——
        # 它逐元素记了矩形、计算样式与命中探针（表格由 `--emit-md` 从它生成、不许手改），
        # 是「读完能复跑、能核对」的那份证据；删掉它就只剩一张不可验证的表。
        exclude: ^(docs/design/beta-launch/|docs/design/mobile/destination/readings/)
      - id: detect-private-key
