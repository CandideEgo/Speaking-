repos:
  # Python linting + formatting (replaces black, isort, flake8)
  # v0.7+ required: pyproject.toml uses UP046/UP047 (PEP 695 generics) rules,
  # which were introduced in ruff 0.7 (0.6.x rejects them as unknown selectors).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend formatting — local prettier so version matches package.json (^3.9.5)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: ^frontend/
        types_or: [ts, tsx, css, json, markdown]

      # Knowledge-layer integrity: broken links, ADR references, wiki frontmatter
      # schema, module vocabulary, growth budgets. Cross-file by nature, so it
      # ignores the passed filename list and rescans the whole layer.
      - id: knowledge-check
        name: knowledge layer integrity
        entry: python scripts/check-knowledge/check_knowledge.py
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|CLAUDE\.md|README\.md|CONTRIBUTING\.md|\.agent/|wiki/|docs/|scripts/check-knowledge/|\.claude/skills/)

      # The advisory half: has code changed under a module some wiki/ document
      # describes? Always runs and always prints, because pre-commit hides the output
      # of a hook that passes and a reminder nobody sees is not a reminder. It fails
      # only on a hole in knowledge-stamps.json, never on the reminder itself.
      - id: knowledge-stale
        name: knowledge staleness reminder
        entry: python scripts/check-knowledge/check_knowledge.py stale
        language: system
        always_run: true
        verbose: true
        pass_filenames: false

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^seeword-beta-assets/
      - id: detect-private-key
