<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R5 · 齐平字幕带（画面 → 字幕 → 文稿卡）</title>
<link rel="stylesheet" href="_reading.css">
<style>
  /* R5：当前句带与画框齐平（0 断层、无边框、无底色差），模式开关成为文稿卡的卡头 */
  .band-flush {
    margin: 0;                 /* 0 断层：画框下沿直接接文字带 */
    padding: 9px 14px 13px;
    background: var(--canvas);
    /* 刻意不画下边框：整段里只留文稿卡那一条外边界 */
  }
  .band-flush .now-en { font-size: 17px; line-height: 30px; }
  .band-flush .now-zh { font-size: 14px; margin-top: 1px; }
  .band-flush .counter { position: absolute; right: 12px; top: 9px; }
</style>
</head>
<body>
<div class="phone">
  <header class="topbar" data-shell="top"></header>

  <main class="scroll">
    <div class="frame"><img src="_asset-frame.png" alt="视频画面"></div>

    <!-- 当前句：与画框齐平的一条带（0 断层、无外框）——它属于「画面这一块」 -->
    <div class="card-flush" style="position:relative">
      <div class="band-flush">
        <p class="now-en">But I think you're coming at it from the wrong perspective.</p>
        <p class="now-zh">但我认为你是从错误的角度看待这件事。</p>
      </div>
    </div>

    <!-- 文稿：另起一张卡，卡头就是模式分段控件（44px）+ 计数 -->
    <section class="sheet sheet--gap">
      <div class="sheet-head">
        <div data-shell="seg"></div>
        <span class="counter">1 / 190</span>
      </div>
      <ul class="list" data-shell="list"></ul>
    </section>

    <div class="tail">本视频暂不出试卷 · 去真题练习 →</div>
  </main>

  <nav class="bottombar" data-shell="bottom"></nav>
</div>
<script src="_reading.js"></script>
<script>mount({ current: 0 });</script>
</body>
</html>
