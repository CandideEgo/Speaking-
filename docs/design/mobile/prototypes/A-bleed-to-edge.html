<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>变体甲 · 出血到底 —— SeeWord 移动端播放页</title>
<link rel="stylesheet" href="_base.css">
<style>
/* ── 变体甲：出血到底 ────────────────────────────────────────────────
   屏高实测（375×812）：视频 211 贴顶 + 卡头 52 + 当前句 142 + 文稿首屏 327 + 迷你窗停靠 80 = 812。
   顶上 0 留白、底下 0 导航 —— 视频尺寸不动，动的是它上下的东西。 */

/* 判屏 375×812 下把机身钉死在视口高度：主滚动区自己滚，右下停靠带才钉得住。
   （_base.css 只在 ≥460px 时才给机身定高，375 下它是 min-height:100vh，长列表会把它撑高） */
@media (max-width: 459px) { .app { height: 100vh; } }

/* 播放器：贴屏幕顶、无边距、无圆角；顶栏以 overlay 浮在画面上（不占一行屏高） */
.player.bleed .frame { border-radius: 0; }
.player.bleed .frame::before {          /* 浮层顶栏下的压暗，保证白字/白图标可读 */
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 76px;
  background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
  z-index: 2; pointer-events: none;
}
/* 四级药丸让出右上角（那儿被浮层顶栏和标尺按钮占了），落到控制条正上方。
   视觉保持 20px 高，::after 把命中区撑到 44px —— 真机上这里是要点的。 */
.player.bleed .pill.lv { position: absolute; bottom: 76px; right: 10px; z-index: 3; }
.player.bleed .pill.lv::after { content: ""; position: absolute; inset: -25px -6px 0; border-radius: var(--radius-pill); }
.player.bleed .ctl { padding: 12px 10px 8px; }
.player.bleed .ctl button { min-width: 44px; height: 44px; }  /* 视频条上的按钮也给足 44px */

/* 滚过视频后顶栏转实心吸顶（shell.js 给 overlay 顶栏写的是行内透明样式，这里得压过去） */
.topbar.overlay.solid { background: var(--topbar-bg) !important; border-bottom: 1px solid var(--hairline) !important; }
.topbar.overlay.solid .icon-btn, .topbar.overlay.solid > span { color: var(--body) !important; }
.topbar.overlay.solid .avatar {
  background: var(--surface-card) !important; border-color: var(--hairline) !important; color: var(--muted-c) !important;
}

/* 标注降到 scrim(55)/弹层(60) 之下：点词时标注不该浮在弹层上面 */
.tag { z-index: 45; }

/* ── 字幕卡头 52px：95/187 · 进度 · 逐句跟读（收起态）· 录音 ── */
.hdr {
  display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px;
  background: var(--canvas); border-bottom: 1px solid var(--hairline);
}
.hdr .counter { flex: 0 0 auto; font-size: 11px; letter-spacing: .02em; color: var(--muted-c); font-variant-numeric: tabular-nums; }
.hdr .pbar { flex: 1 1 auto; height: 3px; border-radius: 2px; background: var(--surface-card); overflow: hidden; }
.hdr .pbar i { display: block; height: 100%; border-radius: 2px; background: var(--brand-500); }
.hbtn {
  flex: 0 0 auto; min-height: 44px; padding: 0 10px; border-radius: var(--radius);
  border: 1px solid var(--hairline); background: var(--canvas); color: var(--body-strong);
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
}
.hbtn svg { width: 15px; height: 15px; }
.hbtn.rec { border-color: transparent; background: var(--brand-50); color: var(--brand-600); }

/* ── 当前句：本页最大字号，紧贴卡头（无边框、无外边距） ── */
.now { padding: 10px 16px 12px; background: var(--surface-soft); }
.now .nowhead { display: flex; align-items: baseline; gap: 8px; height: 16px; }
.now .nowhead .kicker { font-size: 11px; font-weight: 700; color: var(--brand-600); letter-spacing: .02em; }
.now .nowhead .hint { margin-left: auto; }
.now .en { margin-top: 6px; font-size: 21px; font-weight: 700; line-height: 1.28; letter-spacing: -.01em; color: var(--ink); }
.now .zh { margin-top: 6px; font-size: 15px; line-height: 1.5; color: var(--body); }

/* 词级点击区撑到 44px：padding 把盒子撑大，负 margin 把行盒收回来（行距几乎不动） */
.now .word { padding: 8px 2px; margin: -5px 0; }
.script .word { padding: 11px 2px; margin: -8px 0; }

/* ── 整段文稿：满宽单列（文本列 ≈308px，英文 26–30 字符/行） ── */
.seclabel {
  padding: 9px 16px 7px; border-top: 1px solid var(--hairline);
  font-size: 11px; color: var(--muted-soft);
}
.script li { padding: 7px 0; }
.script li.on { padding: 7px 12px; }   /* 压回基底的 10px：高亮行不该比邻行胖 6px，节奏会跳 */
.script .ts { padding-top: 4px; }
.script .en { font-size: 15px; line-height: 1.5; }
.script .zh { font-size: 13px; line-height: 1.5; margin-top: 3px; }
.script li.on .en { color: var(--brand-700); font-weight: 600; }

/* ── 右下迷你窗停靠带 80px：底栏已让位，小窗直接贴屏幕底边 ── */
.dock {
  flex: 0 0 80px; position: relative; z-index: 20;
  display: flex; align-items: center; gap: 12px; padding: 0 12px;
  background: var(--canvas); border-top: 1px solid var(--hairline);
  box-shadow: 0 -4px 14px rgba(10, 10, 10, .05);
}
.dockcap { margin: 0; flex: 1 1 auto; font-size: 11px; line-height: 1.45; color: var(--muted-c); }
.dockcap b { display: block; font-size: 12px; color: var(--ink); }
.mini {
  flex: 0 0 auto; width: 107px; height: 60px; border-radius: 10px; overflow: hidden;
  background: linear-gradient(135deg, #1c1c1c 0%, #0a0a0a 60%); position: relative;
}
.mini .mt { position: absolute; inset: 0; padding: 7px 8px; display: flex; flex-direction: column; justify-content: space-between; }
.mini .mt span { font-size: 9px; line-height: 1.25; color: var(--on-dark-soft); }
.mini .mb { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.25); }
.mini .mb i { display: block; height: 100%; width: 28%; background: var(--brand-500); }
.mini .mplay {
  position: absolute; right: 6px; bottom: 8px; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(250,250,250,.9); color: #0a0a0a; display: flex; align-items: center; justify-content: center;
}
.mini .mplay svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div class="stage">
  <div class="app">

    <!-- 顶栏占位：shell.js 渲染 overlay 顶栏，浮在画面上、不占屏高 -->
    <div id="shell-top"></div>

    <div class="main">

      <!-- ===== 视频：贴屏幕顶、出血铺满整宽，上方留白 0 ===== -->
      <div class="player bleed">
        <div class="frame">
          <div class="titlecard">
            <span class="kicker">CNBC Make It · 四级 · 8:10</span>
            <span class="ttl">How to make discipline so fun it's hard to skip</span>
          </div>
          <span class="pill lv">四级</span>
          <div class="ctl">
            <div class="bar"><i></i><b></b></div>
            <div class="row">
              <button aria-label="暂停">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
              </button>
              <span>1.0×</span>
              <span class="sp"></span>
              <span>中英</span>
              <button aria-label="全屏">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== 字幕卡头：紧贴视频正下方，52px 一行装下真实信息 ===== -->
      <div class="hdr">
        <span class="counter">95 / 187</span>
        <div class="pbar"><i style="width:51%"></i></div>
        <button class="hbtn" title="播一句自动录音，逐句循环">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          逐句跟读
        </button>
        <button class="hbtn rec" title="朗读当前句，录音对比">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><path d="M12 19v3"/></svg>
          录音
        </button>
      </div>

      <!-- ===== 当前句：全页最大字号，英文可点词 ===== -->
      <section class="now">
        <div class="nowhead">
          <span class="kicker">正在读</span>
          <span class="hint">点单词看释义</span>
        </div>
        <div class="en">
          <button class="word">But</button>
          <button class="word">I</button>
          <button class="word">think</button>
          <button class="word">you're</button>
          <button class="word">coming</button>
          <button class="word">at</button>
          <button class="word">it</button>
          <button class="word">from</button>
          <button class="word">the</button>
          <button class="word">wrong</button>
          <button class="word learned">perspective.</button>
        </div>
        <div class="zh">但我觉得，你一开始就理解错了。</div>
      </section>

      <!-- ===== 整段文稿：满宽，脚本按 _demo.js 渲染 ===== -->
      <div class="seclabel">整段文稿 · 187 句</div>
      <div style="padding:0 16px"><ul class="script" id="scriptList"></ul></div>

      <div class="note" id="variant-note"></div>
    </div>

    <!-- 底栏占位：甲里 tabBar 让位，shell.js 不渲染任何东西 -->
    <div id="shell-bottom"></div>

    <!-- 迷你窗停靠带：滚出视频后画面缩进这里（静态示意 + 一行注释） -->
    <div class="dock">
      <span class="tag" style="top:-9px;left:12px">滚动后</span>
      <p class="dockcap"><b>视频滚出屏幕后缩到右下</b>底栏已让位 → 小窗直接贴屏幕底边，不再被导航顶起</p>
      <div class="mini">
        <div class="mt"><span>How to make discipline…</span></div>
        <div class="mplay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></div>
        <div class="mb"><i></i></div>
      </div>
    </div>

    <div id="scrim" style="display:none;position:absolute;inset:0;background:rgba(10,10,10,.45);z-index:55"></div>
    <div class="sheet" id="wordSheet" style="display:none">
      <div class="grab"><i></i></div>
      <div class="body">
        <div class="row" style="gap:8px;align-items:baseline">
          <b style="font-size:22px" data-word>—</b>
          <span class="hint" data-phon>/—/</span>
          <span class="chip" data-pos style="padding:1px 7px;font-size:11px">n.</span>
        </div>
        <p style="margin:8px 0 0;font-size:15px" data-zh>—</p>
        <p style="margin:8px 0 0;font-size:13px;color:var(--muted-c);font-style:italic" data-ex></p>
      </div>
      <div class="foot">
        <button class="btn" data-close-sheet>发音</button>
        <button class="btn primary" style="flex:1" data-close-sheet>加入词库</button>
      </div>
    </div>

  </div>
</div>

<script src="_demo.js"></script>
<script>
/* 整段文稿按 _demo.js 渲染；点词按钮必须在 shell.js 之前进 DOM，
   否则 shell.js 挂载时扫不到它们，点词不出弹层。 */
document.getElementById("scriptList").innerHTML = window.DEMO.script.map(function (s) {
  var en = s.en.split(" ").map(function (w) {
    return '<button class="word">' + w + "</button>";
  }).join(" ");
  return "<li" + (s.cur ? ' class="on"' : "") + ">" +
    '<span class="ts">' + s.t + "</span>" +
    "<div>" +
      '<div class="en">' + en + "</div>" +
      '<div class="zh">' + s.zh + "</div>" +
    "</div>" +
  "</li>";
}).join("");
</script>
<script>
window.SHELL = {
  topBar: "overlay",
  tabBar: "hidden",
  notes: "<b>变体甲 · 出血到底</b><br>" +
    "赌的是竖向空间全还给内容：<b>顶上 0 留白</b>（顶栏 overlay 浮在画面上，滚过视频后自动转实心吸顶），<b>底下 0 导航</b>（tabBar 让位，收回屏高 7%）。视频还是 375×211 的 16:9，一像素没放大 —— 赢的是它上下都没有东西。字幕区（卡头+当前句+文稿）从现状的 36% 拿到 <b>64%</b>。<br>" +
    "· <b>卡头 52px</b>：95/187 + 字幕进度条 + 逐句跟读 + 录音，四项都是 44px 触区；逐句跟读/录音从「卡片中部两个大按钮」降级成一行工具，不再和当前句抢位置。顶栏的搜索/通知仍是 _base.css 里的 36px，三个变体共用，本文件没动。<br>" +
    "· <b>当前句 21px</b> 是全页最大字号（文稿正文 15px），每个单词 45px 点击区；点词出底部弹层，<code>perspective / discipline / challenging</code> 有真词释，其余走壳里的占位文案。弹层顶边约 y635，当前句（y263–405）不会被盖住；点到文稿里靠下的词时，脚本把那一行滚到弹层上方。<br>" +
    "· <b>整段文稿满宽</b>：时间戳 34px + 308px 文本列，英文 15px 实测 33–38 字符/行（Netflix 上限 42 以内），不再是现状那样缩到屏宽 1/3。<b>这里跟 brief 的 ≤32 差一档</b>：要压到 32 得把英文提到 17px，每句多占一行、可见句数掉四分之一，本变体选了密度。触区的账也写在明处：每词 47px 点击区把每行撑高 6px，一句约 99px，首屏约 3.3 句。<br>" +
    "· 右下那扇小窗是「滚出视频后」的迷你播放器示意图：底栏已让位，它直接贴屏幕底边，不再被导航顶起。真实实现只在 scrollTop&gt;180 时浮现，这里是常显的静态示意。",
  bands: [
    { label: "顶栏（浮层）", pct: 0, chrome: true },
    { label: "视频 16:9 出血", pct: 26 },
    { label: "字幕卡头", pct: 6.4 },
    { label: "当前句 21px", pct: 17.5 },
    { label: "整段文稿首屏", pct: 40.2 },
    { label: "迷你窗停靠带", pct: 9.9, chrome: true }
  ]
};
</script>
<script src="shell.js"></script>
<script>
(function () {
  function ready(fn) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  }

  ready(function () {
    var main = document.querySelector(".main");
    var topbar = document.querySelector(".topbar");
    var sheet = document.getElementById("wordSheet");

    /* 浮层顶栏一旦滚过视频就得变实心，否则白图标落在白底文稿上 */
    main.addEventListener("scroll", function () {
      if (topbar) topbar.classList.toggle("solid", main.scrollTop > 180);
    });

    /* 点词后保证那句还在弹层上方：弹层顶边会盖住文稿里靠下的行 */
    document.addEventListener("click", function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var w = t.closest(".word");
      if (!w) return;
      setTimeout(function () {
        if (!sheet || sheet.style.display === "none") return;
        var r = w.getBoundingClientRect();
        var ceiling = sheet.getBoundingClientRect().top - 16;
        var shift = r.bottom > ceiling ? r.bottom - ceiling : 0;
        if (r.top - shift < 72) shift = r.top - 72;
        if (shift) main.scrollTop += shift;
      }, 0);
    });
  });
})();
</script>
</body>
</html>
