# Synthetic E3a reselection spike: Bifrost only. No real provider credentials.
name: seeword-v2-bifrost-spike

services:
  bifrost:
    image: docker.m.daocloud.io/maximhq/bifrost:v2.4.0
    environment:
      APP_PORT: "8080"
      LOG_LEVEL: info
      LOG_STYLE: json
    ports:
      - "127.0.0.1:13200:8080"
    volumes:
      - ./bifrost-data:/app/data
    networks: [synthetic]

  synthetic-provider:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python"]
    command: ["/spike/provider_stub.py"]
    ports:
      - "127.0.0.1:14002:4010"
    volumes:
      - ./provider_stub.py:/spike/provider_stub.py:ro
    networks: [synthetic]

networks:
  synthetic:
