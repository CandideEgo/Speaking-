# Synthetic E3a reselection spike: New API only. No real provider credentials.
name: seeword-v2-newapi-spike

services:
  new-api:
    image: docker.m.daocloud.io/calciumion/new-api:v1.0.0-rc.47
    environment:
      TZ: UTC
      # Local SQLite under /data; this stack is disposable.
      SESSION_SECRET: synthetic-newapi-session-only
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - newapi-data:/data
    networks: [synthetic]

  synthetic-provider:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python"]
    command: ["/spike/provider_stub.py"]
    ports:
      - "127.0.0.1:14001:4010"
    volumes:
      - ./provider_stub.py:/spike/provider_stub.py:ro
    networks: [synthetic]

volumes:
  newapi-data:

networks:
  synthetic:
    # Host port publishing does not materialize on an internal-only network in
    # this Docker Desktop version; the stack is still local-only (no real keys).
    name: seeword-v2-newapi-spike
