# Local capacity evaluation for the reduced-footprint gateway.
# Synthetic provider, disposable DB/Redis, memory limits matching a 1.6 GB host.
name: seeword-v2-gateway-eval

services:
  gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: eval-only
      POSTGRES_DB: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: eval-only
    command:
      - sh
      - -c
      - >-
        until pg_isready -h gateway-db -U gw; do sleep 1; done;
        psql -h gateway-db -U gw -d gateway -c 'CREATE SCHEMA IF NOT EXISTS litellm;'
    depends_on:
      gateway-db:
        condition: service_healthy
    restart: "no"

  gateway-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "eval-only"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "eval-only", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  synthetic-provider:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python"]
    command: ["/spike/provider_stub.py"]
    volumes:
      - ../../../deploy/v2-gateway/provider_stub.py:/spike/provider_stub.py:ro

  gateway:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["/bin/sh", "/spike/entrypoint-gateway.sh"]
    environment:
      COMMANDCODE_API_KEY: eval-only-key
      COMMANDCODE_MODEL: eval-model
      LITELLM_MASTER_KEY: sk-eval-only
      LITELLM_DATABASE_URL: postgresql://gw:eval-only@gateway-db:5432/gateway?schema=litellm
      REDIS_GATEWAY_PASSWORD: eval-only
      GATEWAY_REDIS_HOST: gateway-redis
      GATEWAY_REDIS_PORT: "6379"
      GATEWAY_REDIS_DB: "0"
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-1}
      MALLOC_ARENA_MAX: "2"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      LITELLM_TELEMETRY: "False"
      LITELLM_DB_POOL_LIMIT: ${LITELLM_DB_POOL_LIMIT:-5}
      V2_INPUT_COST_PER_TOKEN: "0.00001"
      V2_OUTPUT_COST_PER_TOKEN: "0.0001"
      V2_MAX_INPUT_TOKENS: "4096"
      V2_MAX_OUTPUT_TOKENS: "128"
      TZ: UTC
    volumes:
      - ../../../deploy/v2-gateway/config.prod.template.yaml:/spike/config.prod.template.yaml:ro
      - ../../../deploy/v2-gateway/render_config.py:/spike/render_config.py:ro
      - ../../../deploy/v2-gateway/entrypoint-gateway.sh:/spike/entrypoint-gateway.sh:ro
    mem_limit: ${GATEWAY_MEM_LIMIT:-256m}
    ports:
      - "127.0.0.1:16001:4000"
    depends_on:
      gateway-db:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      gateway-db-init:
        condition: service_completed_successfully
      llm-gateway-shim:
        condition: service_started

  llm-gateway-shim:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python", "-m", "uvicorn", "app:shim_app", "--host", "0.0.0.0", "--port", "4100"]
    working_dir: /adapter
    environment:
      UPSTREAM_BASE_URL: http://synthetic-provider:4010/v1
      MODEL_MAX_OUTPUT_TOKENS: "128"
      ADAPTER_TIMEOUT_SECONDS: "30"
    volumes:
      - ../../../deploy/v2-gateway/adapter:/adapter:ro
    mem_limit: 64m

  adapter:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "4000"]
    working_dir: /adapter
    environment:
      LITELLM_BASE_URL: http://gateway:4000
      MODEL_MAX_OUTPUT_TOKENS: "128"
      ADAPTER_TIMEOUT_SECONDS: "30"
    ports:
      - "127.0.0.1:16000:4000"
    volumes:
      - ../../../deploy/v2-gateway/adapter:/adapter:ro
    mem_limit: 64m
