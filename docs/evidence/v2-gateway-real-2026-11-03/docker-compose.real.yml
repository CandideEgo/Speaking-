# Local real-provider verification for the V2 gateway stack.
# Pass the backend .env for COMMANDCODE_* and provide LITELLM_MASTER_KEY,
# REDIS_GATEWAY_PASSWORD on the command line. No production data is mounted.
name: seeword-v2-gateway-real

services:
  gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: local-gateway-only
      POSTGRES_DB: gateway
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: local-gateway-only
    command:
      - sh
      - -c
      - >-
        until pg_isready -h gateway-db -U gw; do sleep 1; done;
        psql -h gateway-db -U gw -d gateway -c 'CREATE SCHEMA IF NOT EXISTS litellm;'
    depends_on:
      gateway-db:
        condition: service_healthy
    restart: "no"

  gateway-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "local-gateway-only"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-gateway-only", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["/bin/sh", "/spike/entrypoint-gateway.sh"]
    environment:
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:?set COMMANDCODE_API_KEY}
      COMMANDCODE_MODEL: ${COMMANDCODE_MODEL:-minimax/minimax-m3.1-flash:free}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: postgresql://gw:local-gateway-only@gateway-db:5432/gateway?schema=litellm
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?set REDIS_GATEWAY_PASSWORD}
      GATEWAY_REDIS_HOST: gateway-redis
      GATEWAY_REDIS_PORT: "6379"
      GATEWAY_REDIS_DB: "0"
      V2_INPUT_COST_PER_TOKEN: ${V2_INPUT_COST_PER_TOKEN:-0}
      V2_OUTPUT_COST_PER_TOKEN: ${V2_OUTPUT_COST_PER_TOKEN:-0}
      V2_MAX_INPUT_TOKENS: ${V2_MAX_INPUT_TOKENS:-4096}
      V2_MAX_OUTPUT_TOKENS: ${V2_MAX_OUTPUT_TOKENS:-128}
      TZ: UTC
    volumes:
      - ../../../deploy/v2-gateway/config.prod.template.yaml:/spike/config.prod.template.yaml:ro
      - ../../../deploy/v2-gateway/render_config.py:/spike/render_config.py:ro
      - ../../../deploy/v2-gateway/entrypoint-gateway.sh:/spike/entrypoint-gateway.sh:ro
    ports:
      - "127.0.0.1:15001:4000"
    depends_on:
      gateway-db:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      gateway-db-init:
        condition: service_completed_successfully
      llm-gateway-shim:
        condition: service_started

  synthetic-provider:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python"]
    command: ["/spike/provider_stub.py"]
    volumes:
      - ../../../deploy/v2-gateway/provider_stub.py:/spike/provider_stub.py:ro

  llm-gateway-shim:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python", "-m", "uvicorn", "app:shim_app", "--host", "0.0.0.0", "--port", "4100"]
    working_dir: /adapter
    environment:
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://synthetic-provider:4010/v1}
      MODEL_MAX_OUTPUT_TOKENS: ${V2_MAX_OUTPUT_TOKENS:-128}
      ADAPTER_TIMEOUT_SECONDS: "30"
    volumes:
      - ../../../deploy/v2-gateway/adapter:/adapter:ro

  adapter:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "4000"]
    working_dir: /adapter
    environment:
      LITELLM_BASE_URL: http://gateway:4000
      MODEL_MAX_OUTPUT_TOKENS: ${V2_MAX_OUTPUT_TOKENS:-128}
      ADAPTER_TIMEOUT_SECONDS: "30"
    ports:
      - "127.0.0.1:15000:4000"
    volumes:
      - ../../../deploy/v2-gateway/adapter:/adapter:ro
    depends_on:
      - gateway

volumes:
  gateway-db:
