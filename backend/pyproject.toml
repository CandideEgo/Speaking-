[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "TID251", # flake8-tidy-imports banned-api (INV-005)
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument (FastAPI Depends pattern)
    "E711",   # none comparison (SQLAlchemy filter pattern)
    "E712",   # true/false comparison (SQLAlchemy filter pattern)
    "E402",   # module import not at top (FastAPI app setup pattern)
    "F401",   # unused import (some are __init__.py re-exports)
    "RUF001", # ambiguous unicode character (Chinese strings)
    "RUF002", # ambiguous unicode character (Chinese docstrings)
    "RUF003", # ambiguous unicode character (Chinese comments)
    "SIM",    # simplify suggestions (opinionated, low value)
    "UP042",  # replace-str-enum (intentional pattern)
    "UP046",  # non-pep695-generic-class (Python 3.12 feature)
    "UP047",  # non-pep695-generic-function (Python 3.12 feature)
    "N806",   # non-lowercase variable (DB model patterns)
    "TC003",  # typing-only standard library import
]

# INV-005: AI calls must go through the service layer so cost control, retries and
# logging live in one place. Only TID251 is selected (not all of TID) to avoid
# pulling in unrelated tidy-imports rules.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openai".msg = "AI calls must go through app.services.ai_service or app.services.translation (INV-005)"

[tool.ruff.lint.per-file-ignores]
"app/services/ai_service.py" = ["TID251"]                  # the gateway itself
"app/services/translation/*" = ["TID251"]                  # the pluggable translation engine
"scripts/precompute_global_word_notes_dual.py" = ["TID251"] # one-off operator tooling, not a runtime path

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
# Intentionally empty: pytest.ini takes precedence over this table, so a section here
# was silently ignored — including `--timeout=60`, which is why a hung test used to
# consume the whole CI job budget instead of failing. Pytest config lives in pytest.ini.
# If you move it back here, delete pytest.ini in the same change.
