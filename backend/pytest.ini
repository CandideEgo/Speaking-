[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database)
# pytest.ini wins over pyproject.toml, so this is the config that actually runs
# (pytest warns that it is "ignoring pytest config in pyproject.toml"). Keep the
# timeout here: a test that blocks on a dropped TCP connection otherwise burns the
# job's whole budget instead of failing in a minute. A duplicate config in
# pyproject.toml would silently drop it again.
addopts = -v --tb=short --timeout=60
