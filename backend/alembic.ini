[alembic]
script_location = migrations
# Put this directory on sys.path so `from app.core.database import Base` in env.py resolves.
# Needed because a console-script `alembic` invocation (CI, docker exec) does NOT have the
# working directory on sys.path the way `python -m alembic` does. Without this, bare
# `alembic upgrade head` from backend/ dies with ModuleNotFoundError: No module named 'app'.
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
