<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建账号 - SeeWord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   SeeWord Auth - 真实项目风格
   橙 #ff5a1f · Inter / JetBrains Mono · 暗色可切换
   设计 token 取自 03-home-b-seeword.html / 04-video-card.html
   ═══════════════════════════════════════════════════════ */

/* --- 主题变量（亮色） --- */
:root {
  --canvas: #ffffff;
  --surface-soft: #fafafa;
  --surface-card: #f4f4f5;
  --surface-strong: #ededed;
  --ink: #0a0a0a;
  --body: #27272a;
  --muted: #71717a;
  --muted-soft: #a1a1aa;
  --hairline: #ededed;
  --hairline-soft: #f4f4f5;

  --brand-50: #fff1eb;
  --brand-100: #ffe0d3;
  --brand-300: #ff9b76;
  --brand-400: #ff7a45;
  --brand-500: #ff5a1f;
  --brand-600: #e84a10;
  --brand-700: #c33c0c;

  --indigo: #6366f1;
  --success: #16a34a;
  --success-soft: #dcfce7;
  --warning: #d97706;
  --warning-soft: #fef3c7;
  --error: #dc2626;
  --red-soft: #fee2e2;
  --lime: #84cc16;
  --on-primary: #ffffff;

  --shadow-soft: 0 1px 2px rgba(10,10,10,.04), 0 1px 3px rgba(10,10,10,.04);
  --shadow-card: 0 2px 8px rgba(10,10,10,.05), 0 1px 2px rgba(10,10,10,.04);
  --shadow-lift: 0 12px 32px rgba(10,10,10,.08), 0 2px 8px rgba(10,10,10,.04);
  --shadow-brand: 0 8px 24px rgba(255,90,31,0.28);

  --r-xs: 4px; --r-sm: 8px; --r-md: 10px; --r: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 9999px;

  --dot-color: rgba(0,0,0,0.04);
  --orb-color: rgba(255,90,31,0.10);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* --- 主题变量（暗色） --- */
html.dark {
  --canvas: #0a0a0a;
  --surface-soft: #111112;
  --surface-card: #1a1a1c;
  --surface-strong: #262628;
  --ink: #fafafa;
  --body: #d4d4d8;
  --muted: #a1a1aa;
  --muted-soft: #6b6b72;
  --hairline: #242426;
  --hairline-soft: #1a1a1c;

  --brand-50: #241109;
  --brand-100: #2f170c;
  --brand-700: #ff7a45;

  --success: #22c55e;
  --success-soft: #052e16;
  --warning: #f59e0b;
  --warning-soft: #422006;
  --error: #ef4444;
  --red-soft: #3b0a0a;

  --shadow-soft: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.5);
  --shadow-card: 0 2px 8px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.5);
  --shadow-lift: 0 12px 32px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.5);

  --dot-color: rgba(255,255,255,0.035);
  --orb-color: rgba(255,90,31,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--surface-soft); }
html.dark { background: var(--surface-soft); }

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--surface-soft);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv02","cv03","cv04","cv11";
  transition: background 0.2s, color 0.2s;
}

::selection { background: var(--brand-500); color: #fff; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { text-decoration: none; color: inherit; }
input { font-family: inherit; }

/* ── 氛围背景 ── */
.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.ambient::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
  background-size: 26px 26px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 75%);
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(110px);
}
.orb-1 {
  width: 520px; height: 520px;
  background: radial-gradient(circle, var(--orb-color), transparent 70%);
  top: -18%; right: -10%;
  animation: drift 20s ease-in-out infinite alternate;
}
.orb-2 {
  width: 460px; height: 460px;
  background: radial-gradient(circle, var(--orb-color), transparent 70%);
  bottom: -22%; left: -12%;
  animation: drift 26s ease-in-out infinite alternate-reverse;
}
@keyframes drift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(36px, 28px) scale(1.08); }
}

/* ── 右上角主题切换 ── */
.theme-toggle {
  position: fixed; top: 20px; right: 24px; z-index: 50;
  width: 38px; height: 38px; border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  background: color-mix(in oklab, var(--canvas) 80%, transparent);
  border: 1px solid var(--hairline);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-soft);
  transition: all 0.15s;
}
.theme-toggle:hover { color: var(--ink); border-color: var(--brand-500); }

/* ── 主壳 ── */
.shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}

/* ── logo ── */
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 40px;
  animation: rise 0.7s var(--ease) backwards;
}
.logo-mark {
  width: 32px; height: 32px;
  border-radius: var(--r-sm);
  background: var(--brand-500);
  box-shadow: var(--shadow-brand);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 17px;
  font-family: "Inter", sans-serif;
}
.logo-text {
  font-weight: 800; font-size: 18px;
  letter-spacing: -0.02em; color: var(--ink);
}
.logo-text .word { color: var(--brand-500); }

/* ── 卡片 ── */
.card {
  width: 100%;
  max-width: 416px;
  position: relative;
}

/* ── 标题 ── */
.head { margin-bottom: 24px; }
.head h1 {
  font-family: "Inter", sans-serif;
  font-size: 40px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.03em;
  margin-bottom: 12px;
}
.head h1 em {
  font-style: normal;
  color: var(--brand-500);
}
.head p {
  font-size: 14.5px;
  font-weight: 400;
  color: var(--muted);
  line-height: 1.6;
}

/* ── 产品彩蛋：字幕点词演示 ── */
.whisper {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  background: var(--surface-card);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  margin-bottom: 26px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
  line-height: 1.5;
}
.whisper .play {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  background: var(--canvas);
}
.whisper .play svg { margin-left: 1px; }
.whisper em {
  font-family: "Inter", sans-serif;
  font-style: normal;
  font-weight: 500;
  color: var(--ink);
}
.word-hl {
  color: var(--brand-600);
  font-weight: 500;
  border-bottom: 1.5px solid rgba(255,90,31,0.45);
  cursor: default;
  position: relative;
  transition: border-color 0.2s, color 0.2s;
}
.word-hl:hover { border-color: var(--brand-500); color: var(--brand-500); }
.word-hl::after {
  content: attr(data-note);
  position: absolute;
  bottom: calc(100% + 9px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: var(--ink);
  color: var(--canvas);
  font-family: "Inter", sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  font-style: normal;
  padding: 7px 11px;
  border-radius: 7px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: all 0.28s var(--spring);
  box-shadow: var(--shadow-lift);
  z-index: 20;
}
.word-hl::before {
  content: '';
  position: absolute;
  bottom: calc(100% + 5px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  border: 5px solid transparent;
  border-top-color: var(--ink);
  opacity: 0;
  pointer-events: none;
  transition: all 0.28s var(--spring);
  z-index: 21;
}
.word-hl:hover::after,
.word-hl:hover::before {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── 字段 ── */
.field {
  margin-bottom: 16px;
  position: relative;
}
.field-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 7px;
}
.field-label label {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}
.field-label .hint {
  font-size: 11px;
  color: var(--muted-soft);
  font-family: "JetBrains Mono", ui-monospace, monospace;
}

.input-wrap { position: relative; }
.input {
  width: 100%;
  padding: 13px 15px;
  font-size: 14.5px;
  font-family: "Inter", sans-serif;
  font-weight: 400;
  color: var(--ink);
  background: var(--surface-card);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  outline: none;
  transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
}
.input::placeholder { color: var(--muted-soft); font-weight: 400; }
.input:hover { border-color: var(--hairline); }
.input:focus {
  background: var(--canvas);
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(255,90,31,0.12);
}
.input.error {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10);
}

/* 手机号 +86 前缀 */
.input-wrap.with-prefix { display: flex; align-items: stretch; }
.input-prefix {
  display: flex; align-items: center;
  padding: 0 14px;
  font-size: 14.5px; font-weight: 500; color: var(--body);
  background: var(--surface-card);
  border: 1px solid transparent; border-right: none;
  border-radius: var(--r-sm) 0 0 var(--r-sm);
  flex-shrink: 0;
  transition: border-color 0.22s, background 0.22s;
}
.input-wrap.with-prefix .input { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.input-wrap.with-prefix:focus-within .input-prefix {
  border-color: var(--ink);
  background: var(--canvas);
}

.field-error {
  font-size: 12px;
  color: var(--error);
  margin-top: 6px;
  display: none;
  align-items: center;
  gap: 5px;
}
.field-error.visible { display: flex; }

/* 获取验证码按钮 */
.code-btn {
  font-size: 13px; font-weight: 600; color: var(--brand-600);
  background: none; border: none; cursor: pointer; padding: 2px 4px;
  transition: color 0.15s, opacity 0.15s;
}
.code-btn:hover { color: var(--brand-500); }
.code-btn:disabled { color: var(--muted-soft); cursor: not-allowed; }

/* ── 条款 ── */
.terms {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 20px 0 22px;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.2s;
}
.terms.shake { animation: shake 0.42s cubic-bezier(0.36,0.07,0.19,0.97); }
.terms input {
  appearance: none;
  width: 16px; height: 16px;
  min-width: 16px;
  border: 1.5px solid var(--hairline);
  border-radius: 5px;
  background: var(--canvas);
  cursor: pointer;
  position: relative;
  margin-top: 1px;
  transition: all 0.2s var(--ease);
}
.terms input:checked {
  background: var(--ink);
  border-color: var(--ink);
}
.terms input:checked::after {
  content: '';
  position: absolute;
  left: 4.5px; top: 1.5px;
  width: 4px; height: 8px;
  border: solid #fff;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg);
}
.terms-text {
  font-size: 12.5px;
  color: var(--body);
  line-height: 1.6;
  font-weight: 400;
}
.terms-text a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--hairline);
  transition: color 0.2s, border-color 0.2s;
}
.terms-text a:hover { color: var(--brand-600); border-color: var(--brand-500); }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

/* ── 主按钮 ── */
.btn {
  width: 100%;
  padding: 14px;
  font-size: 14.5px;
  font-weight: 600;
  font-family: "Inter", sans-serif;
  letter-spacing: 0.01em;
  color: #fff;
  background: var(--brand-500);
  border: none;
  border-radius: var(--r-lg);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s var(--spring), box-shadow 0.3s, background 0.2s;
  box-shadow: var(--shadow-brand);
}
.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,0.18) 50%, transparent 65%);
  transform: translateX(-100%);
  transition: transform 0.7s var(--ease);
}
.btn:hover {
  background: var(--brand-600);
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(255,90,31,0.32);
}
.btn:hover::before { transform: translateX(100%); }
.btn:active { transform: translateY(0) scale(0.99); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn .spinner {
  display: none;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.32);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto;
}
.btn.loading .btn-label { display: none; }
.btn.loading .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 次要入口 ── */
.alt {
  margin-top: 24px;
  text-align: center;
  font-size: 13.5px;
  color: var(--muted-soft);
  font-weight: 400;
}
.alt a {
  color: var(--ink);
  text-decoration: none;
  font-weight: 500;
  margin-left: 4px;
  border-bottom: 1px solid var(--hairline);
  padding-bottom: 1px;
  transition: color 0.2s, border-color 0.2s;
}
.alt a:hover { color: var(--brand-600); border-color: var(--brand-500); }

/* ── 底部 ── */
.foot {
  margin-top: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.trust {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--muted-soft);
  font-weight: 400;
}
.trust svg { opacity: 0.6; }
.legal {
  font-size: 11.5px;
  color: var(--muted-soft);
}
.legal a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
.legal a:hover { color: var(--ink); }
.legal .sep { margin: 0 8px; opacity: 0.5; }

/* ── 成功弹窗 ── */
.success-overlay {
  position: fixed;
  inset: 0;
  background: color-mix(in oklab, var(--surface-soft) 82%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 24px;
}
.success-overlay.visible { display: flex; }
.success-card {
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: var(--r-xl);
  padding: 44px 48px;
  text-align: center;
  max-width: 400px;
  animation: success-in 0.55s var(--spring);
  box-shadow: var(--shadow-lift);
}
@keyframes success-in {
  from { opacity: 0; transform: scale(0.94) translateY(16px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.success-ring {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 1.5px solid rgba(22, 163, 74, 0.25);
  background: var(--success-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}
.success-ring svg {
  stroke: var(--success);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 30;
  stroke-dashoffset: 30;
  animation: draw 0.5s var(--ease) 0.25s forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.success-card h2 {
  font-family: "Inter", sans-serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.success-card p {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 28px;
  font-weight: 400;
}
.btn-enter {
  display: inline-block;
  padding: 12px 32px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: "Inter", sans-serif;
  color: #fff;
  background: var(--brand-500);
  border: none;
  border-radius: var(--r-lg);
  text-decoration: none;
  transition: transform 0.2s var(--spring), box-shadow 0.3s, background 0.2s;
  box-shadow: var(--shadow-brand);
}
.btn-enter:hover {
  background: var(--brand-600);
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(255,90,31,0.32);
}

/* ── 入场编排 ── */
.card > * {
  animation: rise 0.6s var(--ease) backwards;
}
.card > *:nth-child(1) { animation-delay: 0.08s; }
.card > *:nth-child(2) { animation-delay: 0.14s; }
.card > *:nth-child(3) { animation-delay: 0.20s; }
.card > *:nth-child(4) { animation-delay: 0.26s; }
.foot { animation: rise 0.6s var(--ease) 0.34s backwards; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .shell { padding: 32px 20px; }
  .head h1 { font-size: 34px; }
  .success-card { padding: 36px 28px; }
  .brand { margin-bottom: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="ambient">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换主题">
  <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
  </svg>
  <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<main class="shell">
  <!-- Logo -->
  <div class="brand">
    <div class="logo-mark">S</div>
    <span class="logo-text">See<span class="word">Word</span></span>
  </div>

  <div class="card">
    <!-- 标题 -->
    <div class="head">
      <h1>Meet every <em>word</em></h1>
      <p>在视频里遇见每一个单词 · 免费注册，30 秒开始。</p>
    </div>

    <!-- 产品彩蛋 -->
    <div class="whisper">
      <span class="play">
        <svg width="9" height="9" viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.5v9l8-4.5z"/></svg>
      </span>
      <span>Every <span class="word-hl" data-note="n. 词汇 · 高考">vocabulary</span> opens a new <em>door</em>.</span>
    </div>

    <!-- 表单 -->
    <form id="registerForm" novalidate>
      <!-- 手机号 -->
      <div class="field">
        <div class="field-label">
          <label for="phone">手机号</label>
        </div>
        <div class="input-wrap with-prefix">
          <span class="input-prefix">+86</span>
          <input class="input" type="tel" id="phone" placeholder="请输入手机号" autocomplete="tel" maxlength="11" inputmode="numeric">
        </div>
        <div class="field-error" id="phoneError">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          请输入有效的手机号
        </div>
      </div>

      <!-- 验证码 -->
      <div class="field">
        <div class="field-label">
          <label for="code">验证码</label>
          <button type="button" class="code-btn" id="codeBtn">获取验证码</button>
        </div>
        <div class="input-wrap">
          <input class="input" type="text" id="code" placeholder="6 位验证码" autocomplete="one-time-code" maxlength="6" inputmode="numeric">
        </div>
        <div class="field-error" id="codeError">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          请输入 6 位验证码
        </div>
      </div>

      <!-- 昵称 -->
      <div class="field">
        <div class="field-label">
          <label for="nickname">昵称</label>
          <span class="hint">可选</span>
        </div>
        <div class="input-wrap">
          <input class="input" type="text" id="nickname" placeholder="怎么称呼你？" autocomplete="nickname" maxlength="20">
        </div>
      </div>

      <!-- 密码 -->
      <div class="field">
        <div class="field-label">
          <label for="password">设置密码</label>
          <span class="hint">至少 8 位，含大小写字母和数字</span>
        </div>
        <div class="input-wrap">
          <input class="input" type="password" id="password" placeholder="设置登录密码" autocomplete="new-password">
        </div>
        <div class="field-error" id="passwordError">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          密码至少 8 位，需含大小写字母和数字
        </div>
      </div>

      <!-- 确认密码 -->
      <div class="field">
        <div class="field-label">
          <label for="confirmPassword">确认密码</label>
        </div>
        <div class="input-wrap">
          <input class="input" type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="new-password">
        </div>
        <div class="field-error" id="confirmError">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          两次输入的密码不一致
        </div>
      </div>

      <label class="terms" id="termsWrap">
        <input type="checkbox" id="terms">
        <span class="terms-text">我已阅读并同意 <a href="#">服务条款</a> 与 <a href="#">隐私政策</a></span>
      </label>

      <button type="submit" class="btn" id="submitBtn">
        <span class="btn-label">创建免费账号</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="alt">
      已经有账号了？<a href="01-login.html">直接登录</a>
    </div>
  </div>

  <div class="foot">
    <div class="trust">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      数据加密存储 · 不向第三方共享
    </div>
    <div class="legal">
      <a href="#">服务条款</a><span class="sep">·</span><a href="#">隐私政策</a><span class="sep">·</span><a href="#">联系我们</a>
    </div>
  </div>
</main>

<!-- 成功弹窗 -->
<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-ring">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
    </div>
    <h2>账号已创建</h2>
    <p>欢迎加入 SeeWord。我们为你准备了一批适合新手的视频--打开第一个，点一个词，开始吧。</p>
    <a href="14-onboarding.html" class="btn-enter">进入新手引导</a>
  </div>
</div>

<script>
// ── localStorage 登录态串联 ──
const AUTH_KEY = 'seeword_auth';
const USER_KEY = 'seeword_user';
// 注：不在此强制跳首页 -- 游客也可打开注册页。注册成功后才写入 AUTH_KEY 并进引导。

const form = document.getElementById('registerForm');
const phoneInput = document.getElementById('phone');
const codeInput = document.getElementById('code');
const nickname = document.getElementById('nickname');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirmPassword');
const codeBtn = document.getElementById('codeBtn');
const terms = document.getElementById('terms');
const termsWrap = document.getElementById('termsWrap');
const submitBtn = document.getElementById('submitBtn');

function clearError(input, errorId) {
  input.classList.remove('error');
  document.getElementById(errorId).classList.remove('visible');
}
function setError(input, errorId) {
  input.classList.add('error');
  document.getElementById(errorId).classList.add('visible');
}

// 验证码倒计时（60s）
let countdown = 0, timer = null;
codeBtn.addEventListener('click', () => {
  const phone = phoneInput.value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) {
    setError(phoneInput, 'phoneError');
    return;
  }
  countdown = 60;
  codeBtn.disabled = true;
  codeBtn.textContent = `${countdown}s 后重发`;
  timer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      clearInterval(timer);
      codeBtn.disabled = false;
      codeBtn.textContent = '获取验证码';
    } else {
      codeBtn.textContent = `${countdown}s 后重发`;
    }
  }, 1000);
});

// 输入清除错误
phoneInput.addEventListener('input', () => clearError(phoneInput, 'phoneError'));
codeInput.addEventListener('input', () => clearError(codeInput, 'codeError'));
passwordInput.addEventListener('input', () => clearError(passwordInput, 'passwordError'));
confirmInput.addEventListener('input', () => clearError(confirmInput, 'confirmError'));

// 提交
form.addEventListener('submit', (e) => {
  e.preventDefault();
  let ok = true;

  if (!/^1[3-9]\d{9}$/.test(phoneInput.value.trim())) {
    setError(phoneInput, 'phoneError'); ok = false;
  }
  if (!/^\d{6}$/.test(codeInput.value.trim())) {
    setError(codeInput, 'codeError'); ok = false;
  }
  const pwd = passwordInput.value;
  if (pwd.length < 8 || !/[A-Z]/.test(pwd) || !/[a-z]/.test(pwd) || !/\d/.test(pwd)) {
    setError(passwordInput, 'passwordError'); ok = false;
  }
  if (confirmInput.value !== pwd || !confirmInput.value) {
    setError(confirmInput, 'confirmError'); ok = false;
  }
  if (!terms.checked) {
    termsWrap.classList.add('shake');
    setTimeout(() => termsWrap.classList.remove('shake'), 450);
    ok = false;
  }

  if (!ok) return;

  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  setTimeout(() => {
    submitBtn.classList.remove('loading');
    localStorage.setItem(AUTH_KEY, '1');
    localStorage.setItem(USER_KEY, nickname.value.trim() || '小林');
    document.getElementById('successOverlay').classList.add('visible');
  }, 1200);
});

// 主题切换
const themeToggle = document.getElementById('themeToggle');
const iconSun = themeToggle.querySelector('.icon-sun');
const iconMoon = themeToggle.querySelector('.icon-moon');
themeToggle.addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  iconSun.style.display = isDark ? 'none' : 'block';
  iconMoon.style.display = isDark ? 'block' : 'none';
});
</script>
</body>
</html>
