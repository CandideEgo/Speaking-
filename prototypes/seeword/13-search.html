<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeWord - 搜索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="seeword.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{background:var(--canvas);}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";}
::selection{background:var(--brand-500);color:#fff;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{text-decoration:none;color:inherit;}input{font-family:inherit;}

.topbar{position:sticky;top:0;z-index:40;height:64px;background:color-mix(in oklab,var(--topbar-bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:20px;padding:0 16px;}
@media(min-width:640px){.topbar{padding:0 28px;}}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-500);box-shadow:var(--shadow-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;}
.logo-text{font-weight:800;font-size:18px;letter-spacing:-0.02em;color:var(--ink);}.logo-text .word{color:var(--brand-500);}
.nav-links{display:flex;gap:2px;flex-shrink:0;}
.nav-links a{font-size:14px;font-weight:500;color:var(--muted);padding:8px 14px;border-radius:var(--r-lg);transition:all .15s;}
.nav-links a:hover{color:var(--ink);background:var(--surface-card);}
.nav-links a.active{background:var(--ink);color:var(--canvas);}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;}
.icon-btn{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;}
.icon-btn:hover{color:var(--ink);background:var(--surface-card);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand-500),var(--brand-400));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;border:1px solid var(--hairline);}
@media(max-width:880px){.nav-links{display:none;}}

.container-page{max-width:1100px;margin:0 auto;padding:28px 16px 80px;}
@media(min-width:640px){.container-page{padding:36px 28px 80px;}}

/* 大搜索框 */
.search-hero{margin-bottom:24px;}
.search-box{display:flex;align-items:center;gap:12px;background:var(--canvas);border:1px solid var(--hairline);
  border-radius:var(--r-lg);padding:6px 6px 6px 18px;box-shadow:var(--shadow-soft);transition:all .15s;}
.search-box:focus-within{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(255,90,31,.1);}
.search-box .si{color:var(--muted);flex-shrink:0;}
.search-box input{flex:1;height:48px;font-size:16px;color:var(--ink);background:none;border:none;outline:none;}
.search-box input::placeholder{color:var(--muted-soft);}
.search-box .btn-search{padding:10px 22px;border-radius:var(--r-sm);background:var(--brand-500);color:#fff;font-size:14px;font-weight:600;flex-shrink:0;}
.search-box .btn-search:hover{background:var(--brand-600);}

/* 结果 tab */
.result-tabs{display:flex;gap:2px;border-bottom:1px solid var(--hairline);margin-bottom:20px;}
.r-tab{padding:10px 16px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;}
.r-tab:hover{color:var(--ink);}
.r-tab.active{color:var(--brand-500);border-bottom-color:var(--brand-500);font-weight:600;}
.r-tab .c{font-size:12px;color:var(--muted-soft);margin-left:4px;}

.result-count{font-size:13px;color:var(--muted);margin-bottom:16px;}

/* 视频结果卡 */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.v-card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;transition:all .15s;display:flex;flex-direction:column;}
.v-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:transparent;}
.v-thumb{position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;}
.v-thumb .emoji{font-size:46px;opacity:.85;}
.v-thumb .duration{position:absolute;bottom:8px;right:8px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.7);padding:2px 7px;border-radius:var(--r-xs);font-family:"JetBrains Mono",monospace;}
.v-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.v-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4;}
.v-title mark{background:var(--brand-100);color:var(--brand-700);padding:0 2px;border-radius:2px;}
.v-meta{font-size:12px;color:var(--muted);}

/* 词汇结果 */
.vocab-results{display:flex;flex-direction:column;gap:8px;}
.vr-item{display:flex;align-items:center;gap:14px;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r);padding:14px 18px;}
.vr-item .en{font-size:16px;font-weight:700;color:var(--ink);min-width:140px;}
.vr-item .en mark{background:var(--brand-100);color:var(--brand-700);padding:0 2px;border-radius:2px;}
.vr-item .ph{font-size:12px;color:var(--muted-soft);font-family:"JetBrains Mono",monospace;}
.vr-item .zh{flex:1;font-size:13px;color:var(--body);}
.vr-item .go{color:var(--muted);font-size:13px;}

/* 空态 */
.empty{text-align:center;padding:60px 20px;}
.empty .ic{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty .t{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.empty .d{font-size:13px;color:var(--muted);}
.empty .suggest{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.empty .suggest .chip{padding:7px 14px;border-radius:var(--r-pill);background:var(--canvas);border:1px solid var(--hairline);font-size:13px;color:var(--body);}
.empty .suggest .chip:hover{border-color:var(--ink);color:var(--ink);}


</style>
</head>
<body>

</nav>

<div class="container-page">
  <div class="search-hero">
    <div class="search-box">
      <span class="si"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input id="q" value="dream" placeholder="搜索视频标题、词汇或主题…">

    </div>
  </div>

  <div class="result-tabs">
    <button class="r-tab active">视频 <span class="c">3</span></button>
    <button class="r-tab">词汇 <span class="c">2</span></button>
    <button class="r-tab">主题 <span class="c">1</span></button>
  </div>

  <div class="result-count">找到 3 个与「dream」相关的视频</div>

  <div class="v-grid">
    <a class="v-card" href="05-watch.html">
      <div class="v-thumb" style="background:linear-gradient(135deg,#1e1b4b,#4338ca)"><span class="emoji">🌙</span><span class="duration">8:24</span></div>

        <div class="v-title">为什么我们<mark>dream</mark>？睡眠的科学</div>

      </div>
    </a>
    <a class="v-card" href="05-watch.html">
      <div class="v-thumb" style="background:linear-gradient(135deg,#3b0764,#7e22ce)"><span class="emoji">💭</span><span class="duration">7:30</span></div>

<button class="theme-toggle" id="themeToggle" title="切换主题">
  <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>

<script>
// tab 视觉切换
document.querySelectorAll(".r-tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".r-tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
}));
</script>
