<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeWord - 浏览视频</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#ffffff;--surface-soft:#fafafa;--surface-card:#f4f4f5;--surface-strong:#ededed;
  --ink:#0a0a0a;--body:#27272a;--muted:#71717a;--muted-soft:#a1a1aa;
  --hairline:#ededed;--hairline-soft:#f4f4f5;
  --brand-50:#fff1eb;--brand-100:#ffe0d3;--brand-300:#ff9b76;--brand-400:#ff7a45;--brand-500:#ff5a1f;--brand-600:#e84a10;--brand-700:#c33c0c;
  --indigo:#6366f1;--success:#16a34a;--success-soft:#dcfce7;--warning:#d97706;--warning-soft:#fef3c7;--error:#dc2626;--red-soft:#fee2e2;
  --sky-soft:#f0f9ff;--on-primary:#ffffff;--topbar-bg:#ffffff;
  --shadow-soft:0 1px 2px rgba(10,10,10,.04),0 1px 3px rgba(10,10,10,.04);
  --shadow-card:0 2px 8px rgba(10,10,10,.05),0 1px 2px rgba(10,10,10,.04);
  --shadow-lift:0 12px 32px rgba(10,10,10,.08),0 2px 8px rgba(10,10,10,.04);
  --shadow-brand:0 8px 24px rgba(255,90,31,0.28);
  --r-xs:4px;--r-sm:8px;--r-md:10px;--r:12px;--r-lg:16px;--r-xl:22px;--r-pill:9999px;
}
html.dark{
  --canvas:#0a0a0a;--surface-soft:#111112;--surface-card:#1a1a1c;--surface-strong:#262628;
  --ink:#fafafa;--body:#d4d4d8;--muted:#a1a1aa;--muted-soft:#6b6b72;
  --hairline:#242426;--hairline-soft:#1a1a1c;
  --brand-50:#241109;--brand-100:#2f170c;--brand-700:#ff7a45;
  --success:#22c55e;--success-soft:#052e16;--warning:#f59e0b;--warning-soft:#241a08;--error:#ef4444;--red-soft:#261212;
  --sky-soft:#0c1a24;--topbar-bg:#0e0e10;
  --shadow-soft:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.5);
  --shadow-card:0 2px 8px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);
  --shadow-lift:0 12px 32px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;}html{background:var(--canvas);}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";}
::selection{background:var(--brand-500);color:#fff;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{text-decoration:none;color:inherit;}input{font-family:inherit;}

.topbar{position:sticky;top:0;z-index:40;height:64px;background:color-mix(in oklab,var(--topbar-bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:20px;padding:0 16px;}
@media(min-width:640px){.topbar{padding:0 28px;}}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-500);box-shadow:var(--shadow-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;}
.logo-text{font-weight:800;font-size:18px;letter-spacing:-0.02em;color:var(--ink);}.logo-text .word{color:var(--brand-500);}
.nav-links{display:flex;gap:2px;flex-shrink:0;}
.nav-links a{font-size:14px;font-weight:500;color:var(--muted);padding:8px 14px;border-radius:var(--r-lg);transition:all .15s;}
.nav-links a:hover{color:var(--ink);background:var(--surface-card);}
.nav-links a.active{background:var(--ink);color:var(--canvas);}
.nav-search{flex:1;max-width:420px;margin:0 auto;position:relative;}
.nav-search input{width:100%;height:40px;padding:0 16px 0 38px;font-size:14px;color:var(--ink);background:var(--surface-card);border:1px solid transparent;border-radius:var(--r-sm);outline:none;transition:all .15s;}
.nav-search input::placeholder{color:var(--muted-soft);}
.nav-search input:focus{background:var(--canvas);border-color:var(--ink);box-shadow:0 0 0 3px rgba(255,90,31,.12);}
.nav-search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;}
.icon-btn:hover{color:var(--ink);background:var(--surface-card);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand-500),var(--brand-400));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;border:1px solid var(--hairline);}
@media(max-width:880px){.nav-links,.nav-search{display:none;}}

.container-page{max-width:1320px;margin:0 auto;padding:28px 16px 80px;}
@media(min-width:640px){.container-page{padding:36px 28px 80px;}}
.page-head{margin-bottom:20px;}
.crumb{font-size:12px;color:var(--muted-soft);font-weight:500;margin-bottom:6px;}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-0.025em;}

/* 筛选栏 */
.filter-bar{position:sticky;top:64px;z-index:30;background:color-mix(in oklab,var(--surface-soft) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hairline);padding:14px 0;margin-bottom:24px;}
.filter-row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:2px;}
.f-label{font-size:12px;font-weight:600;color:var(--muted-soft);text-transform:uppercase;letter-spacing:.06em;margin-right:4px;flex-shrink:0;}
.f-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-pill);font-size:13px;font-weight:500;background:var(--canvas);border:1px solid var(--hairline);color:var(--body);white-space:nowrap;transition:all .15s;}
.f-chip:hover{border-color:var(--ink);}
.f-chip.active{background:var(--ink);color:var(--canvas);border-color:var(--ink);}

/* 视频卡网格（复用 video-card 语言） */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.v-card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;transition:all .15s;display:flex;flex-direction:column;}
.v-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:transparent;}
.v-thumb{position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.v-thumb .emoji{font-size:46px;opacity:.85;}
.v-thumb .duration{position:absolute;bottom:8px;right:8px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.7);padding:2px 7px;border-radius:var(--r-xs);font-family:"JetBrains Mono",monospace;}
.v-thumb .diff{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;color:#fff;padding:3px 9px;border-radius:var(--r-pill);backdrop-filter:blur(6px);background:rgba(0,0,0,.45);}
.v-thumb .prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);}
.v-thumb .prog .p{height:100%;background:var(--brand-500);}
.v-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1;}
.v-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4;}
.v-title-en{font-size:12px;color:var(--muted-soft);font-weight:400;line-height:1.4;}
.v-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:auto;flex-wrap:wrap;}
.v-meta .src{display:inline-flex;align-items:center;gap:4px;}
.v-meta .src svg{color:var(--muted-soft);}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:80;width:40px;height:40px;border-radius:50%;background:var(--canvas);border:1px solid var(--hairline);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;color:var(--ink);}

/* 移动端底部 tab 栏 */
.mobile-tab{position:fixed;bottom:0;left:0;right:0;z-index:60;display:none;
  background:color-mix(in oklab,var(--canvas) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--hairline);padding:6px 0 env(safe-area-inset-bottom,8px);
  justify-content:space-around;}
.mobile-tab a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;
  font-size:10px;font-weight:500;color:var(--muted);border-radius:var(--r-sm);min-width:52px;}
.mobile-tab a svg{width:22px;height:22px;}
.mobile-tab a.active{color:var(--brand-500);}
@media(max-width:880px){.mobile-tab{display:flex;}body{padding-bottom:64px;}}
</style>
</head>
<body>

<nav class="topbar">
  <a class="nav-logo" href="03-home-b-seeword.html"><span class="logo-mark">S</span><span class="logo-text">See<span class="word">Word</span></span></a>
  <div class="nav-links">
    <a href="03-home-b-seeword.html">首页</a>
    <a href="11-browse.html" class="active">浏览</a>
    <a href="08-practice-hub.html">练习专题</a>
    <a href="09-vocabulary.html">词汇本</a>
  </div>
  <div class="nav-search"><span class="si"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input placeholder="搜索视频或词汇…" onfocus="location.href='13-search.html'"></div>
  <div class="nav-actions">
    <a class="icon-btn" href="12-history.html" title="学习记录"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></a>
    <a class="avatar" href="07-profile.html">林</a>
  </div>
</nav>

<div class="container-page">
  <div class="page-head">
    <div class="crumb">发现</div>
    <h1>浏览视频</h1>
  </div>

  <div class="filter-bar">
    <div class="filter-row">
      <span class="f-label">分类</span>
      <button class="f-chip active">全部</button>
      <button class="f-chip">科普</button>
      <button class="f-chip">科技</button>
      <button class="f-chip">历史</button>
      <button class="f-chip">生活</button>
      <button class="f-chip">商业</button>
      <button class="f-chip">艺术</button>
    </div>
    <div class="filter-row" style="margin-top:8px">
      <span class="f-label">难度</span>
      <button class="f-chip">A2</button>
      <button class="f-chip active">B1</button>
      <button class="f-chip">B2</button>
      <button class="f-chip">C1</button>
      <span class="f-label" style="margin-left:8px">排序</span>
      <button class="f-chip active">最新</button>
      <button class="f-chip">最热</button>
      <button class="f-chip">词汇多</button>
    </div>
  </div>

  <div class="v-grid" id="grid"></div>
</div>

<button class="theme-toggle" id="themeToggle" title="切换主题">
  <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
</button>

<script>
const VIDEOS=[
  {emoji:"🌙",bg:"linear-gradient(135deg,#1e1b4b,#4338ca)",title:"为什么我们做梦？睡眠的科学",en:"Why Do We Dream?",diff:"B1",dur:"8:24",src:"YouTube",q:28,prog:64},
  {emoji:"🧠",bg:"linear-gradient(135deg,#064e3b,#059669)",title:"记忆如何形成与遗忘",en:"How Memories Form and Fade",diff:"B2",dur:"11:02",src:"YouTube",q:32,prog:0},
  {emoji:"🌊",bg:"linear-gradient(135deg,#0c4a6e,#0284c7)",title:"海洋深处的未知世界",en:"The Unknown Deep Ocean",diff:"B1",dur:"9:48",src:"YouTube",q:26,prog:100},
  {emoji:"🚀",bg:"linear-gradient(135deg,#7c2d12,#ea580c)",title:"火星移民：现实还是幻想",en:"Mars Colonization",diff:"C1",dur:"14:20",src:"YouTube",q:40,prog:0},
  {emoji:"🤖",bg:"linear-gradient(135deg,#3b0764,#7e22ce)",title:"人工智能会取代我们吗",en:"Will AI Replace Us?",diff:"B2",dur:"10:15",src:"YouTube",q:30,prog:15},
  {emoji:"🎸",bg:"linear-gradient(135deg,#500724,#be123c)",title:"音乐如何影响大脑",en:"How Music Affects the Brain",diff:"B1",dur:"12:33",src:"YouTube",q:36,prog:0},
  {emoji:"🌍",bg:"linear-gradient(135deg,#134e4a,#0d9488)",title:"气候变化：我们能做什么",en:"Climate Change",diff:"B2",dur:"13:10",src:"YouTube",q:34,prog:0},
  {emoji:"⚽",bg:"linear-gradient(135deg,#1e3a8a,#3b82f6)",title:"世界杯背后的经济学",en:"Economics of the World Cup",diff:"B1",dur:"7:55",src:"YouTube",q:22,prog:0},
  {emoji:"🍕",bg:"linear-gradient(135deg,#713f12,#a16207)",title:"快餐如何改变世界",en:"How Fast Food Changed the World",diff:"A2",dur:"6:40",src:"YouTube",q:18,prog:0},
  {emoji:"🧬",bg:"linear-gradient(135deg,#4c1d95,#6d28d9)",title:"基因编辑与未来医学",en:"Gene Editing",diff:"C1",dur:"15:22",src:"YouTube",q:42,prog:0},
  {emoji:"🏔️",bg:"linear-gradient(135deg,#334155,#64748b)",title:"珠峰攀登者的心理",en:"Minds of Everest Climbers",diff:"B2",dur:"11:48",src:"YouTube",q:31,prog:0},
  {emoji:"☕",bg:"linear-gradient(135deg,#78350f,#b45309)",title:"咖啡如何改变人类历史",en:"How Coffee Changed History",diff:"B1",dur:"9:12",src:"YouTube",q:27,prog:0},
];
document.getElementById("grid").innerHTML=VIDEOS.map(v=>`
  <a class="v-card" href="05-watch.html">
    <div class="v-thumb" style="background:${v.bg}">
      <span class="diff">${v.diff}</span>
      <span class="emoji">${v.emoji}</span>
      <span class="duration">${v.dur}</span>
      ${v.prog>0&&v.prog<100?`<div class="prog"><div class="p" style="width:${v.prog}%"></div></div>`:""}
    </div>
    <div class="v-body">
      <div class="v-title">${v.title}</div>
      <div class="v-title-en">${v.en}</div>
      <div class="v-meta">
        <span class="src"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${v.src}</span>
        <span>·</span><span>${v.q} 考点词</span>
        ${v.prog>=100?'<span>·</span><span style="color:var(--success)">已学完</span>':v.prog>0?'<span>·</span><span>已学 '+v.prog+'%</span>':''}
      </div>
    </div>
  </a>`).join("");

// 筛选 chip 分组单选
document.querySelectorAll(".filter-row").forEach(row=>{
  row.querySelectorAll(".f-chip").forEach(c=>c.addEventListener("click",()=>{
    row.querySelectorAll(".f-chip").forEach(x=>x.classList.remove("active"));
    c.classList.add("active");
  }));
});

const root=document.documentElement;
document.getElementById("themeToggle").addEventListener("click",()=>{
  root.classList.toggle("dark");
  document.getElementById("themeIcon").innerHTML=root.classList.contains("dark")
    ?'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>'
    :'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
});
</script>

</nav>
