<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeWord - 开通 Pro 会员</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════ SeeWord 升级会员页 · 小商店入口 + 三步指引 ═══════════ */
:root {
  --canvas:#ffffff;--surface-soft:#fafafa;--surface-card:#f4f4f5;--surface-strong:#ededed;
  --ink:#0a0a0a;--body:#27272a;--muted:#71717a;--muted-soft:#a1a1aa;
  --hairline:#ededed;--hairline-soft:#f4f4f5;--topbar-bg:#ffffff;
  --brand-50:#fff1eb;--brand-100:#ffe0d3;--brand-200:#ffc1a8;--brand-300:#ff9b76;
  --brand-400:#ff7a45;--brand-500:#ff5a1f;--brand-600:#e84a10;--brand-700:#c33c0c;
  --indigo:#6366f1;--indigo-soft:#e0e7ff;--success:#16a34a;--success-soft:#dcfce7;
  --warning:#d97706;--warning-soft:#fef3c7;--error:#dc2626;--red-soft:#fee2e2;
  --on-primary:#ffffff;
  --shadow-soft:0 1px 2px rgba(10,10,10,.04),0 1px 3px rgba(10,10,10,.04);
  --shadow-card:0 2px 8px rgba(10,10,10,.05),0 1px 2px rgba(10,10,10,.04);
  --shadow-lift:0 12px 32px rgba(10,10,10,.08),0 2px 8px rgba(10,10,10,.04);
  --shadow-brand:0 8px 24px rgba(255,90,31,0.28);
  --r-xs:4px;--r-sm:8px;--r-md:10px;--r:12px;--r-lg:16px;--r-xl:22px;--r-pill:9999px;
}
html.dark {
  --canvas:#0a0a0a;--surface-soft:#111112;--surface-card:#1a1a1c;--surface-strong:#262628;
  --ink:#fafafa;--body:#d4d4d8;--muted:#a1a1aa;--muted-soft:#6b6b72;
  --hairline:#242426;--hairline-soft:#1a1a1c;--topbar-bg:#0a0a0a;
  --brand-50:#241109;--brand-100:#2f170c;--brand-200:#3d1d0f;--brand-700:#ff7a45;
  --indigo-soft:#1e1b4b;--success:#22c55e;--success-soft:#052e16;--warning:#f59e0b;--warning-soft:#422006;--error:#ef4444;--red-soft:#3b0a0a;
  --shadow-soft:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.5);
  --shadow-card:0 2px 8px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);
  --shadow-lift:0 12px 32px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--canvas);}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";transition:background .2s,color .2s;}
::selection{background:var(--brand-500);color:#fff;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{text-decoration:none;color:inherit;}
.container-page{max-width:560px;margin:0 auto;padding:0 16px;}
@media(min-width:640px){.container-page{padding:0 28px;}}

/* 顶导航（精简） */
.topbar{position:sticky;top:0;z-index:40;height:64px;background:color-mix(in oklab,var(--topbar-bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:20px;padding:0 16px;}
@media(min-width:640px){.topbar{padding:0 28px;}}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-500);box-shadow:var(--shadow-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;}
.logo-text{font-weight:800;font-size:18px;letter-spacing:-0.02em;color:var(--ink);}
.logo-text .word{color:var(--brand-500);}
.nav-spacer{flex:1;}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;}
.icon-btn:hover{color:var(--ink);background:var(--surface-card);}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:var(--r-lg);transition:all .15s;}
.back-link:hover{color:var(--ink);background:var(--surface-card);}

/* 主卡片 */
.main{padding:40px 0 60px;}
.upgrade-card{position:relative;overflow:hidden;border:1px solid var(--hairline);background:var(--canvas);border-radius:var(--r-xl);box-shadow:var(--shadow-lift);padding:32px 28px;}
.upgrade-card::before{content:"";position:absolute;top:-80px;right:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.14),transparent 70%);pointer-events:none;}

.card-icon{position:relative;width:60px;height:60px;border-radius:var(--r-lg);background:var(--brand-50);color:var(--brand-500);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.card-title{position:relative;text-align:center;font-size:26px;font-weight:800;letter-spacing:-0.025em;margin:18px 0 6px;}
.card-sub{position:relative;text-align:center;font-size:14px;color:var(--muted);margin-bottom:22px;}

/* 合规告知 */
.compliance{position:relative;display:flex;gap:11px;border:1px solid var(--hairline);background:var(--surface-soft);border-radius:var(--r-md);padding:14px 15px;margin-bottom:24px;}
.compliance svg{flex-shrink:0;margin-top:1px;color:var(--success);}
.compliance p{font-size:13px;line-height:1.6;color:var(--muted);}
.compliance strong{color:var(--ink);font-weight:600;}

/* 三步指引 */
.steps{position:relative;margin-bottom:24px;}
.steps-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;text-align:center;}
.steps-list{display:flex;flex-direction:column;gap:12px;}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface-soft);transition:border-color .15s,background .15s;}
.step:hover{border-color:var(--brand-300);background:var(--brand-50);}
.step-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--canvas);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:"JetBrains Mono",monospace;}
.step.active .step-num{background:var(--brand-500);box-shadow:var(--shadow-brand);}
.step-text .t{font-size:14px;font-weight:600;color:var(--ink);}
.step-text .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
.step-arrow{align-self:center;color:var(--muted-soft);flex-shrink:0;}

/* 主按钮 */
.btn-store{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:var(--r-lg);font-size:15px;font-weight:600;background:var(--brand-500);color:var(--on-primary);box-shadow:var(--shadow-brand);transition:all .2s;overflow:hidden;}
.btn-store::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-100%);transition:transform .7s;}
.btn-store:hover{background:var(--brand-600);transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,90,31,.32);}
.btn-store:hover::before{transform:translateX(100%);}
.btn-store:active{transform:scale(.98);}

.btn-redeem{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:var(--r-lg);font-size:14px;font-weight:600;background:var(--ink);color:var(--canvas);transition:all .15s;margin-top:11px;}
.btn-redeem:hover{transform:translateY(-1px);background:var(--surface-strong);}

/* 小商店未开通降级态 */
.store-notice{display:none;border:1px solid var(--warning);background:var(--warning-soft);border-radius:var(--r-md);padding:14px 15px;text-align:center;font-size:13px;line-height:1.6;color:var(--warning);}
.store-notice.visible{display:block;}

/* 法律链接 */
.legal{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;font-size:12px;color:var(--muted-soft);}
.legal a{color:var(--muted);transition:color .15s;}
.legal a:hover{color:var(--ink);}
.legal .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-soft);}

/* 返回 */
.back-footer{margin-top:20px;text-align:center;}
.back-footer .back-link{display:inline-flex;}

/* 移动端 tab */
.mobile-tab{position:fixed;bottom:0;left:0;right:0;z-index:60;display:none;background:color-mix(in oklab,var(--canvas) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--hairline);padding:6px 0 env(safe-area-inset-bottom,8px);justify-content:space-around;}
.mobile-tab a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;font-size:10px;font-weight:500;color:var(--muted);border-radius:var(--r-sm);min-width:52px;}
.mobile-tab a svg{width:22px;height:22px;}
.mobile-tab a.active{color:var(--brand-500);}
@media(max-width:880px){.mobile-tab{display:flex;}body{padding-bottom:64px;}}

@media(max-width:640px){
  .main{padding:28px 0 40px;}
  .upgrade-card{padding:26px 20px;}
  .card-title{font-size:22px;}
}
</style>
</head>
<body>

<!-- 顶导航 -->
<nav class="topbar">
  <a class="nav-logo" href="00-router.html">
    <div class="logo-mark">S</div>
    <span class="logo-text">See<span class="word">Word</span></span>
  </a>
  <div class="nav-spacer"></div>
  <div class="nav-actions">
    <button class="icon-btn" id="themeToggle" aria-label="切换主题" title="切换主题">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<!-- 主卡片 -->
<main class="container-page main">
  <div class="upgrade-card">
    <div class="card-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    </div>
    <h1 class="card-title">开通 Pro 会员</h1>
    <p class="card-sub">¥9.9 / 月 · 30 天有效 · 兑换码激活</p>

    <!-- 合规告知 -->
    <div class="compliance">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <p>本网站为<strong>非经营性工具展示平台</strong>，不提供在线支付功能。Pro 会员通过微信小商店购买，购买后使用兑换码激活。</p>
    </div>

    <!-- 三步指引 -->
    <div class="steps">
      <div class="steps-title">如何开通</div>
      <div class="steps-list">
        <div class="step active">
          <div class="step-num">1</div>
          <div class="step-text">
            <div class="t">前往微信小商店购买</div>
            <div class="d">在小商店完成支付，获得 Pro 会员兑换码</div>
          </div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text">
            <div class="t">复制兑换码</div>
            <div class="d">格式为 XXXX-XXXX-XX，共 10 位</div>
          </div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text">
            <div class="t">回本站激活</div>
            <div class="d">在兑换页输入兑换码，立即开通 Pro 权益</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 小商店入口 -->
    <button class="btn-store" id="storeBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      前往微信小商店购买
    </button>

    <!-- 小商店未开通降级提示（演示用，可切换） -->
    <div class="store-notice" id="storeNotice">
      微信小商店即将开通，暂未开放购买。<br>如需提前开通会员，请联系客服。
    </div>

    <!-- 兑换码入口 -->
    <button class="btn-redeem" onclick="location.href='19-redeem.html'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      已购买？使用兑换码激活
    </button>

    <!-- 法律链接 -->
    <div class="legal">
      <a href="20-terms.html">用户协议</a>
      <span class="dot"></span>
      <a href="21-privacy.html">隐私政策</a>
    </div>
  </div>

  <div class="back-footer">
    <a href="22-pricing.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回定价页
    </a>
  </div>
</main>

<!-- 移动端 tab -->
<nav class="mobile-tab">
  <a href="03-home-b-seeword.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1V9.5z"/></svg><span>首页</span></a>
  <a href="11-browse.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>浏览</span></a>
  <a href="08-practice-hub.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg><span>练习</span></a>
  <a href="09-vocabulary.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span>词汇</span></a>
  <a href="07-profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg><span>我的</span></a>
</nav>

<script>
// 演示：模拟「小商店未开通」降级态。真实环境由 siteConfig.miniStoreUrl 决定。
// 这里默认开放购买；点击小商店按钮演示外链跳转（原型不真跳）。
const storeBtn=document.getElementById('storeBtn');
const storeNotice=document.getElementById('storeNotice');
storeBtn.addEventListener('click',()=>{
  // 原型演示：弹一个提示代替真实外链跳转
  // 真实页：window.open(miniStoreUrl, '_blank', 'noopener,noreferrer')
  const original=storeBtn.innerHTML;
  storeBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>即将跳转微信小商店…';
  storeBtn.style.pointerEvents='none';
  setTimeout(()=>{
    storeBtn.innerHTML=original;
    storeBtn.style.pointerEvents='';
    storeNotice.classList.add('visible');
  },1400);
});

// 主题切换
const themeToggle=document.getElementById('themeToggle');
const iconSun=themeToggle.querySelector('.icon-sun');
const iconMoon=themeToggle.querySelector('.icon-moon');
themeToggle.addEventListener('click',()=>{
  document.documentElement.classList.toggle('dark');
  const isDark=document.documentElement.classList.contains('dark');
  iconSun.style.display=isDark?'none':'block';
  iconMoon.style.display=isDark?'block':'none';
});
</script>
</body>
</html>
