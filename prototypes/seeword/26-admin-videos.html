<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeWord Admin - 视频管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════ SeeWord Admin · 视频管理（复用 shell） ═══════════ */
:root {
  --canvas:#ffffff;--surface-soft:#fafafa;--surface-card:#f4f4f5;--surface-strong:#ededed;
  --ink:#0a0a0a;--body:#27272a;--muted:#71717a;--muted-soft:#a1a1aa;
  --hairline:#ededed;--hairline-soft:#f4f4f5;--topbar-bg:#ffffff;--sidebar-bg:#ffffff;
  --brand-50:#fff1eb;--brand-100:#ffe0d3;--brand-200:#ffc1a8;--brand-300:#ff9b76;--brand-400:#ff7a45;--brand-500:#ff5a1f;--brand-600:#e84a10;--brand-700:#c33c0c;
  --indigo:#6366f1;--indigo-soft:#e0e7ff;--success:#16a34a;--success-soft:#dcfce7;--warning:#d97706;--warning-soft:#fef3c7;--error:#dc2626;--red-soft:#fee2e2;
  --on-primary:#ffffff;
  --shadow-soft:0 1px 2px rgba(10,10,10,.04),0 1px 3px rgba(10,10,10,.04);
  --shadow-card:0 2px 8px rgba(10,10,10,.05),0 1px 2px rgba(10,10,10,.04);
  --shadow-lift:0 12px 32px rgba(10,10,10,.08),0 2px 8px rgba(10,10,10,.04);
  --shadow-brand:0 8px 24px rgba(255,90,31,0.28);
  --r-xs:4px;--r-sm:8px;--r-md:10px;--r:12px;--r-lg:16px;--r-xl:22px;--r-pill:9999px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html.dark {
  --canvas:#0a0a0a;--surface-soft:#111112;--surface-card:#1a1a1c;--surface-strong:#262628;
  --ink:#fafafa;--body:#d4d4d8;--muted:#a1a1aa;--muted-soft:#6b6b72;
  --hairline:#242426;--hairline-soft:#1a1a1c;--topbar-bg:#0e0e10;--sidebar-bg:#0e0e10;
  --brand-50:#241109;--brand-100:#2f170c;--brand-200:#3d1d0f;--brand-700:#ff7a45;
  --indigo-soft:#1e1b4b;--success:#22c55e;--success-soft:#052e16;--warning:#f59e0b;--warning-soft:#422006;--error:#ef4444;--red-soft:#3b0a0a;
  --shadow-soft:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.5);
  --shadow-card:0 2px 8px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);
  --shadow-lift:0 12px 32px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--surface-soft);}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";transition:background .2s,color .2s;}
::selection{background:var(--brand-500);color:#fff;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{text-decoration:none;color:inherit;}
input{font-family:inherit;}

/* shell（与 dashboard 一致） */
.layout{display:flex;min-height:100vh;}
.sidebar{width:248px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--hairline);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .25s var(--ease);}
.sidebar.collapsed{width:72px;}
.sb-brand{display:flex;align-items:center;gap:11px;height:64px;border-bottom:1px solid var(--hairline);padding:0 18px;flex-shrink:0;}
.sb-brand .mark{width:34px;height:34px;border-radius:var(--r-sm);background:var(--brand-500);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:var(--shadow-brand);flex-shrink:0;}
.sb-brand .bt{line-height:1.2;white-space:nowrap;overflow:hidden;}
.sb-brand .bt .n{font-size:15px;font-weight:800;letter-spacing:-0.02em;}
.sb-brand .bt .s{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-soft);}
.sidebar.collapsed .sb-brand .bt{display:none;}
.sidebar.collapsed .sb-brand{justify-content:center;padding:0;}
.sb-nav{flex:1;overflow-y:auto;padding:16px 12px;}
.sb-section{margin-bottom:18px;}
.sb-section-title{font-size:10.5px;font-weight:700;color:var(--muted-soft);text-transform:uppercase;letter-spacing:.08em;padding:0 12px;margin-bottom:6px;}
.sidebar.collapsed .sb-section-title{font-size:0;height:8px;padding:0;}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;color:var(--muted);transition:all .15s;position:relative;white-space:nowrap;margin-bottom:1px;}
.sb-item svg{flex-shrink:0;}
.sb-item:hover{color:var(--ink);background:var(--surface-soft);}
.sb-item.active{background:var(--brand-500);color:#fff;box-shadow:var(--shadow-brand);}
.sidebar.collapsed .sb-item{justify-content:center;padding:9px;}
.sidebar.collapsed .sb-item span.lbl{display:none;}
.sb-item .badge{margin-left:auto;background:var(--brand-100);color:var(--brand-700);font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--r-pill);min-width:20px;text-align:center;}
.sb-item.active .badge{background:rgba(255,255,255,.22);color:#fff;}
.sidebar.collapsed .sb-item .badge{position:absolute;top:2px;right:2px;margin:0;min-width:16px;height:16px;font-size:9px;padding:0 4px;}
.sb-foot{border-top:1px solid var(--hairline);padding:10px 12px;flex-shrink:0;}
.sb-foot .sb-item{font-size:12.5px;}
.sb-collapse{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;color:var(--muted);transition:all .15s;width:100%;}
.sb-collapse:hover{color:var(--ink);background:var(--surface-soft);}
.sb-collapse svg{transition:transform .25s;}
.sidebar.collapsed .sb-collapse{justify-content:center;}
.sidebar.collapsed .sb-collapse span{display:none;}
.sidebar.collapsed .sb-collapse svg{transform:rotate(180deg);}
.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .25s var(--ease),width .25s var(--ease);}
.sidebar.mobile-open{transform:translateX(0);}
@media(min-width:768px){.sidebar{position:sticky;transform:none;}.sidebar.collapsed{transform:none;}}
.mobile-overlay{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);}
.mobile-overlay.visible{display:block;}
@media(min-width:768px){.mobile-overlay{display:none!important;}}
.hamburger{display:inline-flex;}
@media(min-width:768px){.hamburger{display:none;}}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;height:64px;background:color-mix(in oklab,var(--topbar-bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0;}
.hamburger{width:38px;height:38px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;}
.hamburger:hover{color:var(--ink);background:var(--surface-card);}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}
.crumb .cur{color:var(--ink);font-weight:600;}
.crumb .sep{color:var(--muted-soft);}
.topbar-spacer{flex:1;}
.tb-action{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--muted);background:var(--surface-card);transition:all .15s;}
.tb-action:hover{color:var(--ink);background:var(--surface-strong);}
.tb-action.icon-only{padding:0;width:36px;justify-content:center;}
.tb-avatar{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:var(--r-pill);background:var(--surface-card);transition:all .15s;cursor:pointer;}
.tb-avatar:hover{background:var(--surface-strong);}
.tb-avatar .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand-500),var(--brand-400));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;}
.tb-avatar .nm{font-size:13px;font-weight:600;}
.tb-avatar .rl{font-size:10.5px;color:var(--muted);}
@media(max-width:640px){.tb-avatar .nm,.tb-avatar .rl{display:none;}.tb-avatar{padding:4px;}}
.content{padding:24px 22px 48px;flex:1;max-width:1400px;width:100%;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
.page-head .desc{font-size:13.5px;color:var(--muted);margin-top:4px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;border-radius:var(--r-sm);transition:all .18s var(--ease);white-space:nowrap;}
.btn-sm{height:34px;padding:0 13px;}
.btn-primary{background:var(--brand-500);color:#fff;box-shadow:var(--shadow-brand);}
.btn-primary:hover{background:var(--brand-600);transform:translateY(-1px);}
.btn-secondary{background:var(--surface-card);color:var(--ink);border:1px solid var(--hairline);}
.btn-secondary:hover{background:var(--surface-strong);border-color:var(--muted-soft);}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:18px;}

/* 工具栏：搜索 + 筛选 */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.search-box{position:relative;flex:1;min-width:200px;max-width:340px;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-soft);}
.search-box input{width:100%;height:38px;padding:0 12px 0 38px;font-size:13.5px;color:var(--ink);background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);outline:none;transition:all .15s;}
.search-box input::placeholder{color:var(--muted-soft);}
.search-box input:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px rgba(255,90,31,.12);}

.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-label{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px;}
.filter-pills{display:flex;gap:5px;flex-wrap:wrap;}
.fpill{font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 13px;border-radius:var(--r-pill);background:var(--surface-card);border:1px solid transparent;transition:all .15s;white-space:nowrap;}
.fpill:hover{color:var(--ink);background:var(--surface-strong);}
.fpill.active{background:var(--ink);color:var(--canvas);}
.fpill.active.brand{background:var(--brand-500);color:#fff;}
.filter-divider{width:1px;height:20px;background:var(--hairline);margin:0 4px;}

/* 表格 */
.table-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--hairline);background:var(--canvas);}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:920px;}
table.data thead th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;background:var(--surface-soft);border-bottom:1px solid var(--hairline);white-space:nowrap;position:sticky;top:0;}
table.data tbody td{padding:12px 14px;border-bottom:1px solid var(--hairline-soft);color:var(--body);vertical-align:middle;}
table.data tbody tr{transition:background .12s;}
table.data tbody tr:hover{background:var(--surface-soft);}
table.data tbody tr:last-child td{border-bottom:none;}
.cell-video{display:flex;align-items:center;gap:11px;min-width:240px;}
.cell-thumb{width:64px;height:38px;border-radius:var(--r-xs);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;}
.cell-video .vt{font-weight:600;color:var(--ink);font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.cell-video .vs{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* 状态/质量徽章 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.b-ready{background:var(--success-soft);color:var(--success);}
.b-processing{background:var(--indigo-soft);color:var(--indigo);}
.b-ready-sub{background:var(--warning-soft);color:var(--warning);}
.b-error{background:var(--red-soft);color:var(--error);}
.b-pending{background:var(--surface-card);color:var(--muted);}
.q-good{background:var(--success-soft);color:var(--success);}
.q-warn{background:var(--warning-soft);color:var(--warning);}
.q-blocked{background:var(--red-soft);color:var(--error);}
.q-na{color:var(--muted-soft);font-size:12px;}

.level-chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);font-family:"JetBrains Mono",monospace;}
.lv-a2{background:var(--success-soft);color:var(--success);}
.lv-b1{background:var(--indigo-soft);color:var(--indigo);}
.lv-b2{background:var(--warning-soft);color:var(--warning);}
.lv-c1{background:var(--red-soft);color:var(--error);}

.mono{font-family:"JetBrains Mono",monospace;font-weight:600;}
.words-count{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:600;color:var(--brand-500);}

/* 行操作 */
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.act-btn{width:30px;height:30px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;}
.act-btn:hover{color:var(--ink);background:var(--surface-card);}
.act-btn.danger:hover{color:var(--error);background:var(--red-soft);}
.act-btn.brand:hover{color:var(--brand-600);background:var(--brand-50);}

/* 分页 */
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:12px;}
.page-info{font-size:13px;color:var(--muted);}
.page-info .mono{color:var(--ink);}
.page-btns{display:flex;gap:4px;}
.pbtn{min-width:34px;height:34px;padding:0 10px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--muted);background:var(--canvas);border:1px solid var(--hairline);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;}
.pbtn:hover:not(:disabled){color:var(--ink);border-color:var(--muted-soft);}
.pbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.pbtn:disabled{opacity:.4;cursor:not-allowed;}

/* 统计条 */
.stat-strip{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.stat-chip{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);font-size:12.5px;}
.stat-chip .n{font-size:17px;font-weight:800;color:var(--ink);font-family:"JetBrains Mono",monospace;}
.stat-chip .l{color:var(--muted);}
.stat-chip .ic{width:30px;height:30px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;}
</style>
</head>

<script>
const VIDEOS=[
  {t:"为什么我们做梦？睡眠的科学",g:"linear-gradient(135deg,#1e1b4b,#4338ca)",e:"🌙",status:"ready",quality:"good",level:"B1",words:23,source:"SciShow",time:"2 小时前"},
  {t:"深海生物：地球最神秘的角落",g:"linear-gradient(135deg,#042f2e,#0d9488)",e:"🐙",status:"ready_subtitles",quality:"warn",level:"B2",words:31,source:"BBC Earth",time:"3 小时前"},
  {t:"人工智能会取代老师吗？",g:"linear-gradient(135deg,#1e1b4b,#7c3aed)",e:"🤖",status:"error",quality:"blocked",level:"B2",words:28,source:"TED-Ed",time:"5 小时前"},
  {t:"如何三分钟泡出完美咖啡",g:"linear-gradient(135deg,#451a03,#b45309)",e:"☕",status:"ready",quality:"good",level:"A2",words:12,source:"Daily Brew",time:"昨天"},
  {t:"宇宙有多大？从地球到可观测边缘",g:"linear-gradient(135deg,#0f0c29,#302b63)",e:"🌌",status:"processing",quality:"na",level:"C1",words:0,source:"Kurzgesagt",time:"12 分钟前"},
  {t:"日本极简生活的智慧",g:"linear-gradient(135deg,#1c1917,#78716c)",e:"🏯",status:"ready_subtitles",quality:"warn",level:"B1",words:19,source:"Cultural Lens",time:"1 天前"},
  {t:"拖延症的心理学",g:"linear-gradient(135deg,#4a044e,#c026d3)",e:"⏰",status:"error",quality:"blocked",level:"B1",words:21,source:"Psych2Go",time:"2 天前"},
  {t:"街头美食文化：曼谷篇",g:"linear-gradient(135deg,#7c2d12,#ea580c)",e:"🍜",status:"ready",quality:"good",level:"A2",words:15,source:"Foodie Walks",time:"2 天前"},
  {t:"为什么音乐能改变情绪",g:"linear-gradient(135deg,#312e81,#6366f1)",e:"🎵",status:"ready",quality:"good",level:"B1",words:17,source:"Vox",time:"3 天前"},
  {t:"亚马逊雨林的隐秘世界",g:"linear-gradient(135deg,#052e16,#16a34a)",e:"🦜",status:"ready_subtitles",quality:"na",level:"B2",words:33,source:"Nat Geo",time:"3 天前"},
];
const STATUS={ready:["b-ready","已发布"],processing:["b-processing","处理中"],ready_subtitles:["b-ready-sub","字幕就绪"],error:["b-error","错误"],pending:["b-pending","待处理"]};
const QUALITY={good:["q-good","🟢 正常"],warn:["q-warn","🟡 警告"],blocked:["q-blocked","🔴 阻塞"],na:["q-na","—"]};
const LV={A2:"lv-a2",B1:"lv-b1",B2:"lv-b2",C1:"lv-c1"};
const tbody=document.getElementById('tbody');
VIDEOS.forEach((v,i)=>{
  const [sc,sl]=STATUS[v.status];
  const [qc,ql]=QUALITY[v.quality];
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td><div class="cell-video"><div class="cell-thumb" style="background:${v.g}">${v.e}</div><div><div class="vt">${v.t}</div><div class="vs">ID: sw_${1000+i}</div></div></div></td>
    <td><span class="badge ${sc}"><span class="dot"></span>${sl}</span></td>
    <td><span class="${qc}">${ql}</span></td>
    <td><span class="level-chip ${LV[v.level]}">${v.level}</span></td>
    <td>${v.words?v.words+' <span class="words-count">词</span>':'<span class="q-na">—</span>'}</td>
    <td style="font-size:12.5px;color:var(--muted)">${v.source}</td>
    <td style="font-size:12px;color:var(--muted)">${v.time}</td>
    <td><div class="row-actions">
      <a class="act-btn" href="27-admin-video-detail.html" title="详情"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></a>
      ${v.quality==='blocked'||v.status==='error'?'<button class="act-btn brand" title="重触发翻译"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>':''}
      <button class="act-btn danger" title="删除"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div></td>`;
  tbody.appendChild(tr);
});

// 筛选交互
function bindPills(id){document.querySelectorAll('#'+id+' .fpill').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('#'+id+' .fpill').forEach(x=>x.classList.remove('active'));p.classList.add('active');}));}
bindPills('statusPills');bindPills('qualityPills');

// shell 交互
const sidebar=document.getElementById('sidebar');
document.getElementById('collapseBtn').addEventListener('click',()=>{if(window.innerWidth>=768)sidebar.classList.toggle('collapsed');});
const hamburger=document.getElementById('hamburger'),overlay=document.getElementById('overlay');
hamburger.addEventListener('click',()=>{sidebar.classList.add('mobile-open');overlay.classList.add('visible');});
overlay.addEventListener('click',()=>{sidebar.classList.remove('mobile-open');overlay.classList.remove('visible');});
document.getElementById('themeToggle').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
</script>
