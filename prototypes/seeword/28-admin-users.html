<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--canvas:#ffffff;--surface-soft:#fafafa;--surface-card:#f4f4f5;--surface-strong:#ededed;--ink:#0a0a0a;--body:#27272a;--muted:#71717a;--muted-soft:#a1a1aa;--hairline:#ededed;--hairline-soft:#f4f4f5;--topbar-bg:#ffffff;--sidebar-bg:#ffffff;--brand-50:#fff1eb;--brand-100:#ffe0d3;--brand-200:#ffc1a8;--brand-300:#ff9b76;--brand-400:#ff7a45;--brand-500:#ff5a1f;--brand-600:#e84a10;--brand-700:#c33c0c;--indigo:#6366f1;--indigo-soft:#e0e7ff;--success:#16a34a;--success-soft:#dcfce7;--warning:#d97706;--warning-soft:#fef3c7;--error:#dc2626;--red-soft:#fee2e2;--on-primary:#ffffff;--shadow-soft:0 1px 2px rgba(10,10,10,.04),0 1px 3px rgba(10,10,10,.04);--shadow-card:0 2px 8px rgba(10,10,10,.05),0 1px 2px rgba(10,10,10,.04);--shadow-lift:0 12px 32px rgba(10,10,10,.08),0 2px 8px rgba(10,10,10,.04);--shadow-brand:0 8px 24px rgba(255,90,31,0.28);--r-xs:4px;--r-sm:8px;--r-md:10px;--r:12px;--r-lg:16px;--r-xl:22px;--r-pill:9999px;--ease:cubic-bezier(.22,.61,.36,1);}
html.dark{--canvas:#0a0a0a;--surface-soft:#111112;--surface-card:#1a1a1c;--surface-strong:#262628;--ink:#fafafa;--body:#d4d4d8;--muted:#a1a1aa;--muted-soft:#6b6b72;--hairline:#242426;--hairline-soft:#1a1a1c;--topbar-bg:#0e0e10;--sidebar-bg:#0e0e10;--brand-50:#241109;--brand-100:#2f170c;--brand-200:#3d1d0f;--brand-700:#ff7a45;--indigo-soft:#1e1b4b;--success:#22c55e;--success-soft:#052e16;--warning:#f59e0b;--warning-soft:#422006;--error:#ef4444;--red-soft:#3b0a0a;--shadow-soft:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.5);--shadow-card:0 2px 8px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);--shadow-lift:0 12px 32px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.5);}
*{margin:0;padding:0;box-sizing:border-box;}html{background:var(--surface-soft);}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";transition:background .2s,color .2s;}
::selection{background:var(--brand-500);color:#fff;}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}a{text-decoration:none;color:inherit;}input,select{font-family:inherit;}
.layout{display:flex;min-height:100vh;}
.sidebar{width:248px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--hairline);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:50;transform:translateX(-100%);transition:transform .25s var(--ease),width .25s var(--ease);}
.sidebar.mobile-open{transform:translateX(0);}
@media(min-width:768px){.sidebar{position:sticky;transform:none;}.sidebar.collapsed{width:72px;}}
.sb-brand{display:flex;align-items:center;gap:11px;height:64px;border-bottom:1px solid var(--hairline);padding:0 18px;flex-shrink:0;}
.sb-brand .mark{width:34px;height:34px;border-radius:var(--r-sm);background:var(--brand-500);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:var(--shadow-brand);flex-shrink:0;}
.sb-brand .bt{line-height:1.2;white-space:nowrap;overflow:hidden;}.sb-brand .bt .n{font-size:15px;font-weight:800;}.sb-brand .bt .s{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-soft);}
.sidebar.collapsed .sb-brand .bt{display:none;}.sidebar.collapsed .sb-brand{justify-content:center;padding:0;}
.sb-nav{flex:1;overflow-y:auto;padding:16px 12px;}.sb-section{margin-bottom:18px;}.sb-section-title{font-size:10.5px;font-weight:700;color:var(--muted-soft);text-transform:uppercase;letter-spacing:.08em;padding:0 12px;margin-bottom:6px;}
.sidebar.collapsed .sb-section-title{font-size:0;height:8px;padding:0;}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap;margin-bottom:1px;position:relative;}
.sb-item svg{flex-shrink:0;}.sb-item:hover{color:var(--ink);background:var(--surface-soft);}.sb-item.active{background:var(--brand-500);color:#fff;box-shadow:var(--shadow-brand);}
.sidebar.collapsed .sb-item{justify-content:center;}.sidebar.collapsed .sb-item span.lbl{display:none;}
.sb-item .badge{margin-left:auto;background:var(--brand-100);color:var(--brand-700);font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--r-pill);min-width:20px;text-align:center;}.sb-item.active .badge{background:rgba(255,255,255,.22);color:#fff;}
.sidebar.collapsed .sb-item .badge{position:absolute;top:2px;right:2px;margin:0;min-width:16px;height:16px;font-size:9px;padding:0 4px;}
.sb-foot{border-top:1px solid var(--hairline);padding:10px 12px;}.sb-foot .sb-item{font-size:12.5px;}
.sb-collapse{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);font-size:12.5px;color:var(--muted);transition:all .15s;width:100%;}.sb-collapse:hover{color:var(--ink);background:var(--surface-soft);}.sb-collapse svg{transition:transform .25s;}
.sidebar.collapsed .sb-collapse{justify-content:center;}.sidebar.collapsed .sb-collapse span{display:none;}.sidebar.collapsed .sb-collapse svg{transform:rotate(180deg);}
.mobile-overlay{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);}.mobile-overlay.visible{display:block;}
@media(min-width:768px){.mobile-overlay{display:none!important;}}.hamburger{display:inline-flex;}@media(min-width:768px){.hamburger{display:none;}}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;height:64px;background:color-mix(in oklab,var(--topbar-bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0;}
.hamburger{width:38px;height:38px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);}.hamburger:hover{color:var(--ink);background:var(--surface-card);}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}.crumb .cur{color:var(--ink);font-weight:600;}.crumb .sep{color:var(--muted-soft);}
.topbar-spacer{flex:1;}
.tb-action{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--muted);background:var(--surface-card);transition:all .15s;}.tb-action:hover{color:var(--ink);background:var(--surface-strong);}.tb-action.icon-only{padding:0;width:36px;justify-content:center;}
.tb-avatar{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:var(--r-pill);background:var(--surface-card);cursor:pointer;}.tb-avatar:hover{background:var(--surface-strong);}.tb-avatar .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand-500),var(--brand-400));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;}.tb-avatar .nm{font-size:13px;font-weight:600;}.tb-avatar .rl{font-size:10.5px;color:var(--muted);}
@media(max-width:640px){.tb-avatar .nm,.tb-avatar .rl{display:none;}.tb-avatar{padding:4px;}}
.content{padding:24px 22px 48px;flex:1;max-width:1400px;width:100%;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-0.02em;}.page-head .desc{font-size:13.5px;color:var(--muted);margin-top:4px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;border-radius:var(--r-sm);transition:all .18s var(--ease);white-space:nowrap;}
.btn-sm{height:34px;padding:0 13px;}.btn-primary{background:var(--brand-500);color:#fff;box-shadow:var(--shadow-brand);}.btn-primary:hover{background:var(--brand-600);transform:translateY(-1px);}.btn-secondary{background:var(--surface-card);color:var(--ink);border:1px solid var(--hairline);}.btn-secondary:hover{background:var(--surface-strong);border-color:var(--muted-soft);}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.search-box{position:relative;flex:1;min-width:200px;max-width:340px;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-soft);}
.search-box input{width:100%;height:38px;padding:0 12px 0 38px;font-size:13.5px;color:var(--ink);background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);outline:none;transition:all .15s;}
.search-box input::placeholder{color:var(--muted-soft);}.search-box input:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px rgba(255,90,31,.12);}
.filter-pills{display:flex;gap:5px;flex-wrap:wrap;}
.fpill{font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 13px;border-radius:var(--r-pill);background:var(--surface-card);transition:all .15s;white-space:nowrap;}
.fpill:hover{color:var(--ink);background:var(--surface-strong);}.fpill.active{background:var(--ink);color:var(--canvas);}
.table-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--hairline);background:var(--canvas);}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:880px;}
table.data thead th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;background:var(--surface-soft);border-bottom:1px solid var(--hairline);white-space:nowrap;}
table.data tbody td{padding:12px 14px;border-bottom:1px solid var(--hairline-soft);color:var(--body);vertical-align:middle;}
table.data tbody tr{transition:background .12s;}table.data tbody tr:hover{background:var(--surface-soft);}table.data tbody tr:last-child td{border-bottom:none;}
.cell-user{display:flex;align-items:center;gap:10px;min-width:180px;}
.uavatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0;}
.cell-user .un{font-weight:600;color:var(--ink);font-size:13.5px;}.cell-user .up{font-size:11.5px;color:var(--muted);margin-top:1px;}
.mono{font-family:"JetBrains Mono",monospace;font-weight:600;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;}
.b-pro{background:linear-gradient(135deg,var(--brand-500),var(--brand-600));color:#fff;}
.b-free{background:var(--surface-card);color:var(--muted);}
.b-expired{background:var(--red-soft);color:var(--error);}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.act-btn{height:30px;padding:0 11px;border-radius:var(--r-xs);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;}
.act-btn:hover{color:var(--ink);background:var(--surface-card);}
.act-btn.brand{color:var(--brand-600);}.act-btn.brand:hover{background:var(--brand-50);}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:12px;}
.page-info{font-size:13px;color:var(--muted);}.page-info .mono{color:var(--ink);}
.page-btns{display:flex;gap:4px;}
.pbtn{min-width:34px;height:34px;padding:0 10px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--muted);background:var(--canvas);border:1px solid var(--hairline);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;}
.pbtn:hover:not(:disabled){color:var(--ink);border-color:var(--muted-soft);}.pbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}.pbtn:disabled{opacity:.4;cursor:not-allowed;}
.stat-strip{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.stat-chip{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-sm);font-size:12.5px;}
.stat-chip .n{font-size:17px;font-weight:800;color:var(--ink);font-family:"JetBrains Mono",monospace;}.stat-chip .l{color:var(--muted);}
.stat-chip .ic{width:30px;height:30px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;}
</style>
</head>
