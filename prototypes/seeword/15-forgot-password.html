<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeWord - 找回密码</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="seeword.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{background:var(--canvas);}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--surface-soft);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";}
::selection{background:var(--brand-500);color:#fff;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{text-decoration:none;color:inherit;}input{font-family:inherit;}

.auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
.auth-card{width:100%;max-width:420px;background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:36px 32px;box-shadow:var(--shadow-lift);}

.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px;}
.logo-mark{width:40px;height:40px;border-radius:var(--r-sm);background:var(--brand-500);box-shadow:var(--shadow-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;}
.logo-text{font-weight:800;font-size:22px;letter-spacing:-0.02em;color:var(--ink);}.logo-text .word{color:var(--brand-500);}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:24px;transition:color .15s;}
.back-link:hover{color:var(--ink);}

.step-ind{display:flex;gap:6px;margin-bottom:24px;}
.step-ind .seg{flex:1;height:3px;border-radius:2px;background:var(--surface-card);transition:background .3s;}
.step-ind .seg.done{background:var(--brand-500);}

h2{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;}
.sub{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.5;}

.step{display:none;}.step.active{display:block;animation:fade .25s ease-out;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:500;color:var(--body);margin-bottom:6px;}
.input{width:100%;height:46px;padding:0 14px;font-size:15px;color:var(--ink);background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-sm);outline:none;transition:all .15s;}
.input:focus{border-color:var(--brand-500);background:var(--canvas);box-shadow:0 0 0 3px rgba(255,90,31,.1);}

.code-row{display:flex;gap:10px;}
.code-row .input{flex:1;}
.btn-code{padding:0 18px;height:46px;border-radius:var(--r-sm);background:var(--surface-card);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap;transition:all .15s;}
.btn-code:hover{background:var(--surface-strong);}
.btn-code:disabled{color:var(--muted-soft);cursor:default;}
.field-hint{font-size:12px;color:var(--muted-soft);margin-top:6px;}
.err{font-size:12px;color:var(--error);margin-top:6px;display:none;}
.err.show{display:block;}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:48px;font-size:15px;font-weight:600;border-radius:var(--r-sm);transition:all .15s;margin-top:8px;}
.btn-primary{background:var(--brand-500);color:#fff;box-shadow:var(--shadow-brand);}
.btn-primary:hover{background:var(--brand-600);}
.btn-primary:disabled{background:var(--surface-card);color:var(--muted-soft);box-shadow:none;cursor:default;}

.alt{font-size:13px;color:var(--muted);text-align:center;margin-top:20px;}
.alt a{color:var(--brand-600);font-weight:600;}

.success-ic{width:64px;height:64px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;box-shadow:0 8px 24px rgba(22,163,74,.3);}


</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><span class="logo-mark">S</span><span class="logo-text">See<span class="word">Word</span></span></div>
    <a class="back-link" href="01-login.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5m7-7l-7 7 7 7"/></svg>返回登录</a>

    <div class="step-ind" id="ind"><span class="seg done"></span><span class="seg"></span><span class="seg"></span></div>

    <!-- Step 1: 手机号 -->
    <div class="step active" data-s="0">
      <h2>找回密码</h2>
      <div class="sub">输入注册时的手机号，我们将发送验证码</div>
      <div class="field">
        <label>手机号</label>
        <input class="input" id="phone" type="tel" placeholder="请输入手机号" value="138 6621 8855">
        <div class="err" id="err0">请输入有效的手机号</div>
      </div>
      <button class="btn btn-primary" id="btn0">发送验证码</button>
    </div>

    <!-- Step 2: 验证码 -->
    <div class="step" data-s="1">
      <h2>输入验证码</h2>
      <div class="sub">验证码已发送至 <strong id="phoneShow" style="color:var(--ink)">138****8855</strong>，5 分钟内有效</div>
      <div class="field">
        <label>验证码</label>
        <div class="code-row">
          <input class="input" id="code" type="text" placeholder="6 位验证码" maxlength="6">
          <button class="btn-code" id="resend" disabled>60s 后重发</button>
        </div>
        <div class="err" id="err1">验证码错误，请重新输入</div>
      </div>
      <button class="btn btn-primary" id="btn1">验证</button>
    </div>

    <!-- Step 3: 新密码 -->
    <div class="step" data-s="2">
      <div class="success-ic">✓</div>
      <h2 style="text-align:center">设置新密码</h2>
      <div class="sub" style="text-align:center">验证成功，请设置新的登录密码</div>
      <div class="field">
        <label>新密码</label>
        <input class="input" id="pwd1" type="password" placeholder="8-20 位，含字母和数字">
        <div class="field-hint">至少 8 位，需包含字母和数字</div>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input class="input" id="pwd2" type="password" placeholder="再次输入新密码">
        <div class="err" id="err2">两次密码不一致</div>
      </div>
      <button class="btn btn-primary" id="btn2">完成修改</button>
    </div>
  </div>
</div>

<button class="theme-toggle" id="themeToggle" title="切换主题">
  <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
</button>

<script>
let cur=0;const TOTAL=3;
const steps=document.querySelectorAll(".step");
const segs=document.querySelectorAll("#ind .seg");
function render(){
  steps.forEach((s,i)=>s.classList.toggle("active",i===cur));
  segs.forEach((s,i)=>{s.className="seg";if(i<=cur)s.classList.add("done");});
}
render();

document.getElementById("btn0").addEventListener("click",()=>{
  const p=document.getElementById("phone").value.trim();
  const e=document.getElementById("err0");
  if(!/^1\d{10}$/.test(p.replace(/\s/g,""))){e.classList.add("show");return;}
  e.classList.remove("show");
  document.getElementById("phoneShow").textContent=p.replace(/(\d{3})\d{4}(\d{4})/,"$1****$2");
  cur=1;render();startResend();
});
document.getElementById("btn1").addEventListener("click",()=>{
  const c=document.getElementById("code").value.trim();
  const e=document.getElementById("err1");
  if(c.length<6){e.classList.add("show");return;}
  e.classList.remove("show");
  cur=2;render();
});
document.getElementById("btn2").addEventListener("click",()=>{
  const p1=document.getElementById("pwd1").value,p2=document.getElementById("pwd2").value;
  const e=document.getElementById("err2");
  if(p1!==p2||p1.length<8){e.classList.add("show");return;}
  location.href="01-login.html";
});

// 重发倒计时
let timer;
function startResend(){
  let n=60;const b=document.getElementById("resend");
  b.disabled=true;b.textContent=n+"s 后重发";
  clearInterval(timer);
  timer=setInterval(()=>{n--;if(n<=0){clearInterval(timer);b.disabled=false;b.textContent="重新发送";}else b.textContent=n+"s 后重发";},1000);
}
document.getElementById("resend").addEventListener("click",()=>{if(!document.getElementById("resend").disabled)return;startResend();});

</script>
<script src="seeword.js"></script>
</body>
</html>
