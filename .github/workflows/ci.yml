name: CI

# NOTE (规则层重构 B / R3, 2026-10-12) — 「给三个 job 各加 paths」在 GitHub Actions 里**做不到**：
# `paths` / `paths-ignore` 只存在于 workflow 的 `on.*` 上，job 级没有这个键。要按端拆触发条件只有两条路：
#
#   (a) 把三个 job 拆成三个 workflow，各自声明 `on.*.paths`。被跳过的 workflow 不产生 check run —
#       看起来是「没跑」而不是「绿了」，这是诚实的那条路；**但**若这三个 job 在分支保护里是 required
#       status check，PR 会一直挂在「未完成」，所以必须同一次调整 required checks。
#   (b) 保留一个 workflow，在 job 内部检测改动集后早退。省事，代价是 job 绿着但没跑测试 ——
#       正是本仓审查原则第 6 条判为最严重的那类静默失效。
#
# 两条都要动分支保护或接受静默跳过，属仓库级决定，**本轮未改触发条件**，只把约束记在这里，
# 免得下一个人照着「job 级 paths」去找一个不存在的键。现状：workflow 级 `paths-ignore` 已让
# markdown-only 改动跳过这三个 job（见 `on:` 下的注释）。

on:
  push:
    branches: [master, main]
    # Markdown-only changes don't affect the app; skip the backend/frontend/e2e
    # jobs rather than paying for a full-stack run.
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seeword
          POSTGRES_PASSWORD: seeword_test
          POSTGRES_DB: seeword_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-cloud.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app/ tests/

      - name: Format check
        working-directory: backend
        run: ruff format --check app/ tests/

      - name: Type check (baseline gate - blocks new errors)
        working-directory: backend
        run: |
          mypy app/ --ignore-missing-imports > /tmp/mypy.txt 2>&1 && mypy_status=0 || mypy_status=$?
          echo "--- mypy output (tail) ---"
          tail -20 /tmp/mypy.txt

          # mypy's contract: 0 = clean, 1 = type errors found. Anything else
          # (2 = usage/config/internal error, missing binary, crash) means the
          # gate never ran. This step used to swallow every exit code with
          # `|| true`, so a broken mypy read as "no new errors".
          if [ "$mypy_status" -ne 0 ] && [ "$mypy_status" -ne 1 ]; then
            echo "::error::mypy failed to run (exit $mypy_status) — the baseline gate did not execute."
            exit 1
          fi

          # Extract "file:code" pairs (Linux mypy emits forward-slash paths, matching .mypy-baseline)
          grep -E ": error:" /tmp/mypy.txt | sed -E 's/^([^:]+):[0-9]+:.*\[(.+)\][[:space:]]*$/\1:\2/' | sort -u > /tmp/mypy-new.txt

          # Exit 1 with nothing extractable means the output shape changed or
          # mypy aborted mid-run; never report that as a clean baseline.
          if [ "$mypy_status" -eq 1 ] && [ ! -s /tmp/mypy-new.txt ]; then
            echo "::error::mypy reported errors (exit 1) but none could be parsed — inspect the output above."
            exit 1
          fi

          echo "--- new errors not in backend/.mypy-baseline ---"
          comm -23 /tmp/mypy-new.txt .mypy-baseline > /tmp/mypy-issues.txt || true
          if [ -s /tmp/mypy-issues.txt ]; then
            echo "::error::New mypy errors introduced. Fix them, or add the file:code pair to backend/.mypy-baseline if intentional:"
            cat /tmp/mypy-issues.txt
            exit 1
          fi
          echo "No new mypy errors (baseline: $(wc -l < .mypy-baseline) file:code pairs). Lower the baseline as you fix existing ones."

      - name: Run tests
        working-directory: backend
        timeout-minutes: 10
        env:
          DATABASE_URL: postgresql+asyncpg://seeword:seeword_test@localhost:5432/seeword_test
          REDIS_URL: redis://localhost:6379/0
          # Must satisfy Settings' non-development rule (>=32 chars); a shorter
          # value makes every Settings() import fail, which takes down both the
          # test job and the e2e backend. Same value as tests/conftest.py.
          JWT_SECRET: test_secret_for_pytest_at_least_32_chars
          ENV: testing
          PUNCTUATION_MODEL_DISABLED: "1"
          # Fixed-code phone flows are opt-in (BE-06); CI has no Aliyun credentials.
          SMS_DEV_FAKE_ENABLED: "true"
        # The Postgres service above was previously unused by pytest (the suite
        # runs on in-memory SQLite). Tests marked `integration`
        # (test_celery_tasks_pg.py — Celery task bodies, with_for_update /
        # skip_locked row-locking semantics) now run against it for real.
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Vulnerability scan (pip-audit)
        # Hard gate. Advisories we knowingly accept are listed in
        # backend/.pip-audit-ignore with a review date; when a date lapses the
        # gate fails, so an accepted advisory has to be re-argued rather than
        # inherited. Rationale for each entry is in that file.
        working-directory: backend
        run: |
          pip install pip-audit
          python scripts/pip_audit_gate.py

  gpu-worker:
    # The GPU transcription worker is a standalone component (``gpu-worker/``)
    # that ships separately from the cloud app. Its unit tests mock the
    # whisperx/torch engines, so CI installs the light dependency subset
    # (requirements-ci.txt) instead of the multi-GB GPU stack. Runtime
    # requirements live in gpu-worker/requirements.txt.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gpu-worker/requirements-ci.txt

      - name: Lint
        working-directory: gpu-worker
        run: ruff check gpu_worker/ tests/ scripts/

      - name: Format check
        working-directory: gpu-worker
        run: ruff format --check gpu_worker/ tests/ scripts/

      - name: Run tests
        working-directory: gpu-worker
        env:
          # Punctuation/transformers are optional; tests must not download models.
          PUNCTUATION_MODEL_DISABLED: "1"
        run: pytest tests -q

      - name: Dependency audit (GPU runtime lock, no model download)
        # A11/OPS-07：GPU 运行栈此前没有任何依赖审计门。这里审计的是
        # ``requirements.lock.txt``（whisperx/torch 的完整传递闭包），用
        # ``--no-deps`` 避免为了同样的版本再解析/下载多 GB 的 CUDA 轮子。
        working-directory: backend
        run: |
          pip install pip-audit
          python scripts/pip_audit_gate.py             -r ../gpu-worker/requirements.lock.txt             --ignore-file ../gpu-worker/.pip-audit-ignore             --no-deps

      - name: SBOM (CycloneDX)
        # 只读锁文件生成 SBOM，不安装 GPU 栈、不下载模型。
        run: |
          python -m pip install "cyclonedx-bom>=5,<7"
          cyclonedx-py requirements gpu-worker/requirements.lock.txt -o gpu-sbom.json

      - name: Upload GPU SBOM
        uses: actions/upload-artifact@v7
        with:
          name: gpu-sbom
          path: gpu-sbom.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Frontend gate (npm run check)
        working-directory: frontend
        # `npm run check` = check-design-system + check-session-writes + tsc --noEmit
        # + eslint + prettier --check（组成见 frontend/package.json，那是这条门禁的
        # 唯一事实源）。
        #
        # 为什么整条跑，而不是像以前那样在 YAML 里逐条列 format:check / tsc / eslint：
        # 逐条列等于把门禁的组成抄成**第二份清单**，以后往 `check` 里加一道检查，
        # CI 不会跟着变 —— 那正是本文件顶部注释里说的「job 绿着但没跑测试」那一类
        # 静默失效。整条跑就没有第二份清单可漂移，新增检查自动进 CI。
        #
        # 覆盖变化（本次改动的要点）：改动前 CI 逐条跑了 format:check / tsc / vitest /
        # eslint，**唯独没跑** scripts/check-design-system.mjs 与
        # scripts/check-session-writes.mjs —— 根 CLAUDE.md 把这两段脚本称为「机器执行的
        # 不变量」「不许为了让检查变绿而放宽检查器」，但它们既不在 CI 也不在
        # pre-commit，于是违规可以照常合进 master。`npm run check` 的头两步就是它们。
        #
        # 失败定位不丢：两段脚本各自打印门禁名与逐条规则结果（design-system 会列出
        # 违规文件与行号），tsc / eslint / prettier 的报错也原样在日志里。另外
        # GitHub Actions 本来就在第一个失败步骤处停下，所以拆成多步并不能多看到
        # 别的失败 —— 整条跑的失败面与拆开跑是一样的。
        run: npm run check

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Verify standalone output
        # A11：默认生产构建必须真的产出 standalone server（OPS-07 / FE-08）。
        # tsc 通过、历史 BUILD_ID 都不能替代这一步。
        working-directory: frontend
        run: test -f .next/standalone/server.js

  e2e:
    # End-to-end tests via Playwright against the full stack (postgres + redis +
    # backend + frontend). The frontend runs in dev mode so next.config.ts
    # rewrites proxy /api and /media to the backend (a prod `next start` build
    # has no proxy and there is no nginx in this job). Hard gate - failures
    # block the PR.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seeword
          POSTGRES_PASSWORD: seeword_test
          POSTGRES_DB: seeword_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://seeword:seeword_test@localhost:5432/seeword_test
      REDIS_URL: redis://localhost:6379/0
      # Must satisfy Settings' non-development rule (>=32 chars); a shorter
      # value makes every Settings() import fail, which takes down both the
      # test job and the e2e backend. Same value as tests/conftest.py.
      JWT_SECRET: test_secret_for_pytest_at_least_32_chars
      ENV: testing
      PUNCTUATION_MODEL_DISABLED: "1"
      # Fixed-code phone flows are opt-in (BE-06); CI has no Aliyun credentials.
      SMS_DEV_FAKE_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-cloud.txt
          pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Check model/migration drift
        # The known backlog is allowlisted with reasons in the script; this
        # fails only when *new* drift appears against the migrated schema.
        working-directory: backend
        run: python scripts/check_schema_drift.py
      - name: Seed e2e data
        # The watch-page e2e tests skip() when the home page has no video;
        # seeding one official ready video makes them execute for real.
        working-directory: backend
        run: python scripts/seed_e2e.py
      - name: Start services and run e2e
        working-directory: frontend
        run: |
          # Backend (uvicorn) + frontend (next dev). The frontend MUST run in
          # dev mode so next.config.ts rewrites proxy /api and /media to the
          # backend - production `next start` has no proxy and there is no
          # nginx in this job, so a prod build cannot reach the backend.
          (cd ../backend && nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &)
          curl --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8000/health
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          curl --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3000
          npx playwright test --project=chromium
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== backend.log (tail) ==="; tail -50 /tmp/backend.log 2>/dev/null || true
          echo "=== frontend.log (tail) ==="; tail -50 /tmp/frontend.log 2>/dev/null || true

  production-config:
    # A11/OPS-07：独立的生产配置预检。不连库、不起容器，只验证「会不会带着
    # 错配置上线」——弱/缺密钥、生产假短信、站内支付误开、compose 白名单与
    # nginx 安全头漂移，每一项都必须让本 job 失败（脚本在 backend/scripts/
    # production_preflight.py，逐条打印实际命令与拒绝原因）。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-cloud.txt

      - name: Production config preflight
        run: python backend/scripts/production_preflight.py
